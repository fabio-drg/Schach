    ] },
  traps: [
    { name: 'Falle: 3.fxe5?? gegen das abgelehnte Gambit', moves: `e4 e5 f4 Bc5 fxe5 {Ein Fehler!} Qh4+ g3 Qxe4+ {Die Dame gabelt König und Turm h1.}`, text: 'Nach …Dxe4+ fällt auch der Turm h1. Im Königsgambit ist die Diagonale e1–h4 immer gefährlich.' },
  ] },

{ id: 'wiener', group: 'offen', name: 'Wiener Partie', eco: 'C25–C29', side: 'w', start: 3,
  intro: `<p>Weiß spielt <b>2.Sc3</b> statt 2.Sf3 und bereitet so f4 vor – ein Königsgambit mit besserer Vorbereitung. Flexibel: Weiß kann scharf (f4) oder ruhig (g3, Lg2) weiterspielen.</p>`,
  plans: { w: 'Mit f4 die f-Linie öffnen oder ruhig mit g3/Lg2 und d3 aufbauen.', b: 'Mit …Sf6 und …d5 das Zentrum öffnen – das ist die prinzipiellste Antwort.' },
  main: `e4 e5 Nc3 Nf6 f4 {Das Wiener Gambit.} d5 {Die beste Antwort: Schwarz schlägt im Zentrum zu.} fxe5 Nxe4 Nf3 Be7 d4 O-O Bd3 f5 exf6 Bxf6 O-O Nc6`,
  vars: [
    { name: 'Ruhiges Wiener System mit g3', moves: `e4 e5 Nc3 Nf6 g3 d5 exd5 Nxd5 Bg2 Nxc3 bxc3 Bd6 Nf3 O-O O-O`, text: 'Positionelles Spiel mit dem Läufer auf der langen Diagonale.' },
  ],
  konter: { text: `<p>Gegen die Wiener Partie ist <b>2…Sf6</b> mit dem Plan <b>…d5</b> die beste Antwort. Auf 3.Lc4 hilft 3…Sxe4! (mit der Gabel-Idee …d5), auf 3.f4 sofort 3…d5.</p>`,
    lines: [ { name: 'Gegen 3.Lc4: 3…Sxe4!', moves: `e4 e5 Nc3 Nf6 Bc4 Nxe4 {Der Gabeltrick: Auf Sxe4 folgt …d5.} Qh5 Nd6 Bb3 Nc6 Nb5 g6 Qf3 f5 Qd5 Qe7 Nxc7+ Kd8 Nxa8 b6`, text: 'Eine bekannte scharfe Linie: Schwarz opfert den Turm a8, sperrt aber den Springer ein und bekommt großes Spiel.' } ] },
  traps: [] },

{ id: 'petrow', group: 'offen', name: 'Russische Verteidigung (Petrow)', eco: 'C42–C43', side: 'b', start: 4,
  intro: `<p>Schwarz antwortet auf 2.Sf3 nicht mit der Deckung von e5, sondern greift selbst e4 an. Die Petrow-Verteidigung ist extrem solide und eine Lieblingswaffe von Spielern wie Caruana, wenn sie mit Schwarz sicher stehen wollen.</p>`,
  plans: { w: 'Schnell entwickeln, mit c4 Druck auf das Zentrum, kleiner Raumvorteil.', b: 'Springer auf e4 halten, …d5, …Ld6/…Le7, kurz rochieren. Symmetrische, sehr stabile Strukturen.' },
  main: `e4 e5 Nf3 Nf6 {Schwarz greift sofort e4 an.} Nxe5 d6 {Wichtig! Zuerst den Springer vertreiben.} Nf3 Nxe4 d4 d5 Bd3 Nc6 O-O Be7 c4 Nb4 Be2 O-O Nc3 Bf5`,
  vars: [
    { name: '3.d4 (Steinitz-Variante)', moves: `e4 e5 Nf3 Nf6 d4 Nxe4 Bd3 d5 Nxe5 Nd7 Nxd7 Bxd7 O-O Bd6 c4 c6`, text: 'Weiß öffnet sofort das Zentrum. Schwarz steht stabil.' },
  ],
  konter: { text: `<p>Weiß spielt gegen den Petrow meist <b>3.Sxe5</b> oder <b>3.d4</b>. Eine moderne, gefährlichere Idee ist <b>5.Sc3</b> mit langer Rochade – Weiß tauscht den Springer e4 und greift mit Bauern am Königsflügel an.</p>`,
    lines: [ { name: 'Weiß: 5.Sc3 mit langer Rochade', moves: `e4 e5 Nf3 Nf6 Nxe5 d6 Nf3 Nxe4 Nc3 {Tauscht den aktiven Springer.} Nxc3 dxc3 Be7 Be3 Nc6 Qd2 Be6 O-O-O Qd7`, text: 'Beide Seiten rochieren entgegengesetzt – die Partie wird viel schärfer als üblich.' } ] },
  traps: [
    { name: 'Die klassische Petrow-Falle (3…Sxe4??)', moves: `e4 e5 Nf3 Nf6 Nxe5 Nxe4 {Ein Fehler: Schwarz kopiert Weiß.} Qe2 {Greift den Springer e4 an – und durch die offene e-Linie den König.} Nf6 Nc6+ {Abzugsschach! Die Dame d8 ist angegriffen.}`, text: 'Weiß gewinnt die Dame. Merke: Im Petrow nach 3.Sxe5 immer zuerst 3…d6!' },
  ] },

{ id: 'philidor', group: 'offen', name: 'Philidor-Verteidigung', eco: 'C41', side: 'b', start: 4,
  intro: `<p>Schwarz deckt e5 mit dem Bauern d6. Benannt nach dem französischen Komponisten und Meister François-André Philidor (18. Jhd.). Solide, aber etwas passiv – Schwarz baut eine feste Mauer und kontert später.</p>`,
  plans: { w: 'Natürliche Entwicklung, Raumvorteil nutzen, Lc4 gegen f7.', b: 'Hanham-Aufbau: …Sf6, …Sbd7, …Le7, …O-O, …c6 – später …b5 oder …exd4 mit Gegenspiel.' },
  main: `e4 e5 Nf3 d6 d4 Nf6 {Die moderne Zugfolge.} Nc3 Nbd7 {Hanham-Variante: Schwarz hält e5.} Bc4 Be7 O-O O-O a4 c6 Re1 b6`,
  vars: [],
  konter: { text: `<p>Gegen den Philidor spielt Weiß am besten <b>3.d4</b> mit schneller Entwicklung. Achte auf die Idee <b>Lc4 und Sg5</b> gegen f7 und auf frühes <b>dxe5</b>, das Schwarz an der Rochade hindert.</p>`,
    lines: [ { name: 'Weiß: 3.d4 exd4 4.Sxd4', moves: `e4 e5 Nf3 d6 d4 exd4 Nxd4 Nf6 Nc3 Be7 Bf4 O-O Qd2 d5 e5 Ne4 Nxe4 dxe4 O-O-O`, text: 'Nimmt Schwarz auf d4, hat Weiß freies Spiel und Raum.' } ] },
  traps: [
    { name: 'Légals Matt', moves: `e4 e5 Nf3 d6 Bc4 Bg4 Nc3 g6 {Ein langsamer Zug.} Nxe5 {Weiß "opfert" die Dame!} Bxd1 {Gierig.} Bxf7+ Ke7 Nd5#`, text: 'Das berühmte Légals Matt von 1750. Schwarz hätte 5…dxe5 spielen müssen (Weiß gewinnt nur einen Bauern).' },
  ] },

{ id: 'stafford', group: 'offen', name: 'Stafford-Gambit', eco: 'C42', side: 'b', start: 5,
  intro: `<p>Ein trickreiches Gambit aus dem Petrow: Schwarz opfert einen Bauern und stellt viele Fallen. Objektiv schlecht – aber in Blitzpartien sehr erfolgreich, wenn der Gegner es nicht kennt. Hier lernst du vor allem, wie man es <b>als Weiß widerlegt</b>.</p>`,
  plans: { w: 'Ruhig bleiben: d3 statt e5, keine gierigen Züge, kurz rochieren – dann ist Weiß einfach einen Bauern vorne.', b: 'Schnell entwickeln (…Lc5, …Sg4, …h5) und auf f2 losgehen.' },
  main: `e4 e5 Nf3 Nf6 Nxe5 Nc6 {Das Stafford-Gambit.} Nxc6 dxc6 d3 {Die sicherste Antwort.} Bc5 Be2 h5 Nc3 Ng4 Bxg4 hxg4 Be3 Bd6 Qd2`,
  vars: [],
  konter: { text: `<p><b>Widerlegung für Weiß:</b> Nach 4.Sxc6 dxc6 spiele <b>5.d3</b> (oder 5.Sc3) – nicht 5.e5?!, das zu Fallen führt. Dann Le2, Sc3, Le3 und O-O. Schwarz hat keinen Ausgleich für den Bauern.</p>`, lines: [] },
  traps: [
    { name: 'Stafford-Falle nach 5.e5?', moves: `e4 e5 Nf3 Nf6 Nxe5 Nc6 Nxc6 dxc6 e5 Ne4 d3 {Ein Fehler.} Bc5 dxe4 Bxf2+ Ke2 Bg4+ {Die Dame d1 ist angegriffen und verloren.}`, text: 'So gewinnt Schwarz in Blitzpartien. Merke: 5.d3!' },
  ] },

// ======================================================= HALBOFFENE
{ id: 'sizilianisch-najdorf', group: 'halboffen', name: 'Sizilianisch: Najdorf', eco: 'B90–B99', side: 'b', start: 10,
  intro: `<p>Die berühmteste und am tiefsten analysierte Eröffnung überhaupt – Fischers und Kasparovs Lieblingswaffe. Mit <b>1…c5</b> kämpft Schwarz asymmetrisch um d4. Nach dem Tausch auf d4 hat Schwarz einen Zentrumsbauern mehr, Weiß einen Entwicklungsvorsprung. Der Zug <b>5…a6</b> ist flexibel: Er verhindert Sb5 und Lb5 und bereitet …e5 oder …b5 vor.</p>`,
  plans: { w: 'Englischer Angriff: Le3, f3, Dd2, lange Rochade und Bauernsturm g4–g5. Alternativ Lg5 und f4 (scharf) oder ruhig Le2.', b: 'Gegenspiel am Damenflügel: …b5, …Lb7, …Tc8, …Sbd7 – oft Bauernopfer auf c3 (Qualitätsopfer …Txc3). Mit …e5 Kontrolle über d5.' },
  main: `e4 c5 {Die Sizilianische Verteidigung.} Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 {Die Najdorf-Variante.} Be3 {Englischer Angriff.} e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O Nbd7 g4 b5 {Beide Seiten greifen den gegnerischen König an.} g5 b4`,
  vars: [
    { name: '6.Lg5 (Hauptvariante alt)', moves: `e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Be7 Qf3 Qc7 O-O-O Nbd7 g4 b5`, text: 'Sehr scharf und theoretisch – Weiß greift mit f4–f5 und g4–g5 an.' },
    { name: '6.Le2 (klassisch, ruhig)', moves: `e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be2 e5 Nb3 Be7 O-O O-O Be3 Be6 Qd2 Nbd7 a4 Rc8`, text: 'Positionelles Spiel um das Feld d5.' },
    { name: 'Vergiftete-Bauer-Variante', moves: `e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Qb6 {Schwarz greift b2 an.} Qd2 Qxb2 {Der „vergiftete Bauer“ – Fischers Spezialität.} Rb1 Qa3`, text: 'Schwarz nimmt den Bauern und muss sich gegen einen gewaltigen Entwicklungsvorsprung verteidigen.' },
  ],
  konter: { text: `<p>Als Weiß musst du nicht ins offene Sizilianisch. <b>Anti-Sizilianer</b> vermeiden die Theorie:</p><ul><li><b>Alapin 2.c3</b> – bereitet d4 vor, damit Weiß mit Bauern zurückschlagen kann.</li><li><b>Rossolimo 3.Lb5</b> (nach 2…Sc6) bzw. <b>Moskauer Variante 3.Lb5+</b> (nach 2…d6).</li><li><b>Smith-Morra-Gambit 2.d4 cxd4 3.c3</b> – Bauernopfer für schnelle Entwicklung.</li><li><b>Grand-Prix-Angriff 2.Sc3 und f4</b> – Königsangriff.</li></ul><p>Jede davon hat eine eigene Seite in der Liste (Alapin, Smith-Morra, Rossolimo, Grand Prix).</p>`,
    lines: [ { name: 'Moskauer Variante 3.Lb5+', moves: `e4 c5 Nf3 d6 Bb5+ Bd7 Bxd7+ Qxd7 O-O Nc6 c3 Nf6 Re1 e6 d4 cxd4 cxd4 d5 e5 Ne4`, text: 'Weiß tauscht Läufer und baut ein einfaches Zentrum auf – wenig Theorie.' } ] },
  traps: [] },

{ id: 'sizilianisch-drachen', group: 'halboffen', name: 'Sizilianisch: Drachenvariante', eco: 'B70–B79', side: 'b', start: 10,
  intro: `<p>Schwarz stellt den Läufer nach <b>g7</b> („Fianchetto“) – die Bauernkette erinnert an das Sternbild Drache. Der Läufer auf der langen Diagonale ist eine Waffe gegen den weißen Damenflügel. Gegen den <b>Jugoslawischen Angriff</b> entsteht ein reines Rennen: Wer mattsetzt zuerst?</p>`,
  plans: { w: 'Jugoslawischer Angriff: Le3, f3, Dd2, Lc4, lange Rochade, dann h4–h5 und Lh6, um den Drachenläufer zu tauschen. „Läufer tauschen, h-Linie öffnen, mattsetzen.“', b: 'Halboffene c-Linie: …Tc8, …Se5–c4, Qualitätsopfer auf c3, Bauernsturm …b5. Den Läufer g7 behalten!' },
  main: `e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 {Die Drachenvariante.} Be3 Bg7 f3 O-O Qd2 Nc6 Bc4 Bd7 O-O-O {Jugoslawischer Angriff.} Rc8 Bb3 Ne5 h4 h5 {Soltis-Variante – bremst den weißen h-Bauern.} Kb1 Nc4`,
  vars: [
    { name: 'Klassisch 6.Le2', moves: `e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be2 Bg7 O-O O-O Be3 Nc6 Nb3 Be6 f4 Qc8`, text: 'Ruhige Rochade auf derselben Seite – Schwarz steht hier sehr gut.' },
  ],
  konter: { text: `<p>Weiß spielt gegen den Drachen fast immer den <b>Jugoslawischen Angriff</b> (Hauptvariante). Schlüsselideen: <b>Lh6</b> zum Läufertausch, <b>h4–h5</b> zur Linienöffnung. Achtung: Schwarz' Qualitätsopfer <b>…Txc3</b> ist oft stark.</p>`, lines: [] },
  traps: [
    { name: 'Drachen-Falle: …Sxd4?? und der Läufer g7', moves: `e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3 Bg7 f3 Nc6 Qd2 O-O Bc4 Nxe4 {Ein bekannter Trick: Gabelidee auf d4.} Nxc6 bxc6 Nxe4 d5`, text: 'Schwarz bekommt die Figur zurück und hat ein aktives Zentrum – auf solche Taktiken auf d4/e4 musst du als Weiß achten.' },
  ] },

{ id: 'sizilianisch-sveshnikov', group: 'halboffen', name: 'Sizilianisch: Sveshnikov', eco: 'B33', side: 'b', start: 10,
  intro: `<p>Schwarz spielt früh <b>…e5</b> und nimmt eine Schwäche auf d5 in Kauf, bekommt dafür aber aktive Figuren und das Läuferpaar. Magnus Carlsen hat diese Variante im WM-Kampf 2018 eingesetzt.</p>`,
  plans: { w: 'Das Feld d5 mit dem Springer besetzen, Bauernstruktur ausnutzen, Spiel am Damenflügel mit a4 und c4.', b: 'Dynamisches Spiel mit …f5, Läuferpaar, Angriff am Königsflügel.' },
  main: `e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3 e5 {Sveshnikov – Schwarz vertreibt den Springer sofort.} Ndb5 d6 Bg5 a6 Na3 b5 Bxf6 gxf6 {Schwarz nimmt eine kaputte Struktur für das Läuferpaar in Kauf.} Nd5 f5 Bd3 Be6 O-O Bxd5 exd5 Ne7`,
  vars: [],
  konter: { text: `<p>Wer das Sveshnikov vermeiden will, spielt nach 2…Sc6 <b>3.Lb5 (Rossolimo)</b> – siehe eigene Seite.</p>`, lines: [] },
  traps: [] },

{ id: 'sizilianisch-taimanov', group: 'halboffen', name: 'Sizilianisch: Taimanov / Kan', eco: 'B44–B49', side: 'b', start: 6,
  intro: `<p>Mit <b>2…e6</b> hält Schwarz die Stellung flexibel. Der Läufer f8 kann nach e7, b4 oder c5, die Dame geht oft nach c7. Weniger Theorie als im Najdorf, aber sehr solide und gesund.</p>`,
  plans: { w: 'Raumvorteil, Rochade, f4 oder ein Englischer Angriff mit Le3/f3/Dd2.', b: 'Flexible Igelstellung: …a6, …Dc7, …Sf6, …b5. Gegenspiel am Damenflügel.' },
  main: `e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nc6 {Taimanov-Variante.} Nc3 Qc7 {Kontrolliert e5.} Be2 a6 O-O Nf6 Kh1 Bb4 Nxc6 bxc6 Qd4`,
  vars: [
    { name: 'Kan-Variante 4…a6', moves: `e4 c5 Nf3 e6 d4 cxd4 Nxd4 a6 {Kan-Variante.} Bd3 Bc5 Nb3 Ba7 O-O Nc6 Qe2 d6 c4 Nge7`, text: 'Noch flexibler – Schwarz hält alle Optionen offen.' },
  ],
  konter: { text: '<p>Gegen 2…e6 funktioniert auch die Alapin-Idee 2.c3 sehr gut, oder Weiß spielt geschlossen mit d3/g3 (Königsindischer Angriff).</p>', lines: [] },
  traps: [] },

{ id: 'alapin', group: 'halboffen', name: 'Sizilianisch: Alapin 2.c3', eco: 'B22', side: 'w', start: 3,
  intro: `<p>Der beliebteste <b>Anti-Sizilianer</b> für Weiß. Mit 2.c3 bereitet Weiß d4 vor, um auf …cxd4 mit dem c-Bauern zurückzuschlagen und ein klassisches Bauernzentrum zu bekommen. Wenig Theorie, klare Pläne.</p>`,
  plans: { w: 'd4 durchsetzen, schnell entwickeln (Sf3, Ld3/Lc4, O-O). Oft entsteht ein isolierter d-Bauer mit aktiven Figuren.', b: 'Sofort mit …d5 oder …Sf6 das Zentrum angreifen.' },
  main: `e4 c5 c3 {Alapin-Variante.} Nf6 {Greift e4 an.} e5 Nd5 d4 cxd4 Nf3 Nc6 cxd4 d6 Bc4 Nb6 Bb5 dxe5 Nxe5 Bd7`,
  vars: [
    { name: '2…d5', moves: `e4 c5 c3 d5 exd5 Qxd5 d4 Nf6 Nf3 e6 Be2 Nc6 O-O cxd4 cxd4 Be7 Nc3 Qd6`, text: 'Die Dame steht früh auf d5, weil Weiß sie nicht mit Sc3 vertreiben kann (c3 ist besetzt).' },
  ],
  konter: { text: '<p>Als Schwarz gegen Alapin: <b>2…Sf6</b> oder <b>2…d5</b> – beide treffen das Zentrum sofort. Vermeide passive Züge wie 2…e6 3.d4 d5, die in schlechte französische Strukturen führen.</p>', lines: [] },
  traps: [] },

{ id: 'smith-morra', group: 'halboffen', name: 'Sizilianisch: Smith-Morra-Gambit', eco: 'B21', side: 'w', start: 5,
  intro: `<p>Weiß opfert einen Bauern für schnelle Entwicklung und offene Linien gegen den Sizilianer. Viele Fallen, viel Initiative – im Vereinsschach sehr gefährlich.</p>`,
  plans: { w: 'Sc3, Sf3, Lc4, O-O, De2, Td1 – Druck auf die d-Linie und f7. Ideen wie e5 und Sd5.', b: 'Sorgfältig entwickeln, …e6, …a6, …Sge7 – Fallen vermeiden, dann ist der Mehrbauer viel wert.' },
  main: `e4 c5 d4 cxd4 c3 {Das Smith-Morra-Gambit.} dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O Nf6 Qe2 Be7 Rd1 e5 Be3 O-O`,
  vars: [],
  konter: { text: '<p>Wer das Gambit nicht annehmen will: <b>3…Sf6 4.e5 Sd5</b> – das führt in eine Alapin-ähnliche Stellung. Oder 3…d3!? und den Bauern zurückgeben.</p>',
    lines: [ { name: 'Ablehnen mit 3…Sf6', moves: `e4 c5 d4 cxd4 c3 Nf6 e5 Nd5 cxd4 d6 Nf3 Nc6 Bc4 Nb6 Bb5 dxe5 Nxe5 Bd7`, text: 'Schwarz vermeidet das Gambit und bekommt eine gesunde Stellung.' } ] },
  traps: [
    { name: 'Falle: Siberian Trap (Schwarz gewinnt)', moves: `e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 e6 Bc4 Qc7 O-O Nf6 Qe2 Ng4 {Droht Matt auf h2!} h3 Nd4 {Die Dame wird angegriffen – und nach Nxd4 folgt …Dh2#.}`, text: 'Auch der Angreifer muss aufpassen: Die Doppeldrohung auf e2 und h2 gewinnt für Schwarz.' },
  ] },

{ id: 'rossolimo', group: 'halboffen', name: 'Sizilianisch: Rossolimo 3.Lb5', eco: 'B30–B31', side: 'w', start: 5,
  intro: `<p>Gegen 2…Sc6 vermeidet Weiß mit 3.Lb5 das offene Sizilianisch (und damit Sveshnikov und Co.). Weiß tauscht oft auf c6 und spielt gegen die schwarzen Doppelbauern.</p>`,
  plans: { w: 'Lxc6, d3, h3, Sc3, Le3 – ruhiges Spiel gegen die c-Bauern. Später f4 oder ein Durchbruch im Zentrum.', b: 'Fianchetto mit …g6/…Lg7, Läuferpaar ausnutzen.' },
  main: `e4 c5 Nf3 Nc6 Bb5 {Rossolimo-Variante.} g6 Bxc6 dxc6 d3 Bg7 h3 Nf6 Nc3 O-O Be3 b6 Qd2 e5`,
  vars: [ { name: '3…e6', moves: `e4 c5 Nf3 Nc6 Bb5 e6 O-O Nge7 Re1 a6 Bf1 d5 exd5 Nxd5 d4`, text: 'Schwarz will den Läufer nicht tauschen lassen und spielt flexibel.' } ],
  konter: { text: '<p>Gegen Rossolimo sind <b>3…g6</b> (Läuferpaar mit Fianchetto) und <b>3…e6</b> die Hauptwege.</p>', lines: [] },
  traps: [] },

{ id: 'grandprix', group: 'halboffen', name: 'Sizilianisch: Geschlossen / Grand Prix', eco: 'B23–B26', side: 'w', start: 3,
  intro: `<p>Mit <b>2.Sc3</b> und später <b>f4</b> plant Weiß einen direkten Königsangriff statt Zentrumsöffnung. Der Grand-Prix-Angriff war in englischen Turnieren der 80er sehr beliebt.</p>`,
  plans: { w: 'f4, Sf3, Lc4 oder Lb5, O-O, dann f5 und Df1–h4 mit Königsangriff.', b: 'Fianchetto …g6/…Lg7, …e6 und …d5, um das Zentrum zu öffnen.' },
  main: `e4 c5 Nc3 Nc6 f4 {Grand-Prix-Angriff.} g6 Nf3 Bg7 Bc4 e6 O-O Nge7 d3 d5 Bb3 O-O`,
  vars: [ { name: 'Geschlossenes Sizilianisch g3', moves: `e4 c5 Nc3 Nc6 g3 g6 Bg2 Bg7 d3 d6 Be3 e5 Qd2 Nge7 Bh6 O-O h4`, text: 'Langsamer Aufbau mit Angriff am Königsflügel.' } ],
  konter: { text: '<p>Schwarz' + "'" + 's beste Antwort: schnell …d5 durchsetzen, um das Zentrum zu öffnen, bevor Weiß' + "'" + 's Angriff ankommt.</p>', lines: [] },
  traps: [] },

{ id: 'franzoesisch', group: 'halboffen', name: 'Französische Verteidigung', eco: 'C00–C19', side: 'b', start: 4,
  intro: `<p>Mit <b>1…e6</b> und <b>2…d5</b> greift Schwarz e4 an. Typisch ist eine geschlossene Struktur mit festen Bauernketten. Schwarz' Problem: der eingesperrte Läufer c8. Dafür bekommt Schwarz eine sehr stabile Stellung und klares Gegenspiel mit <b>…c5</b> und <b>…f6</b>.</p>`,
  plans: { w: 'Raumvorteil mit e5, Angriff am Königsflügel (Dg4, h4), Bauernkette d4/e5 halten.', b: 'Die Basis der Kette mit …c5 angreifen, dann …Sc6, …Db6 auf d4. Später …f6 gegen e5.' },
  main: `e4 e6 d4 d5 {Die Französische Verteidigung.} Nc3 {Hauptlinie.} Nf6 {Klassisch.} e5 {Steinitz-Variante.} Nfd7 f4 c5 Nf3 Nc6 Be3 cxd4 Nxd4 Bc5 Qd2 O-O O-O-O a6`,
  vars: [
    { name: 'Winawer 3…Lb4', moves: `e4 e6 d4 d5 Nc3 Bb4 {Winawer-Variante – Fesselung des Springers.} e5 c5 a3 Bxc3+ bxc3 Ne7 Qg4 {Weiß greift sofort g7 an.} Qc7 Qxg7 Rg8 Qxh7 cxd4 Ne2 Nbc6 f4 Bd7`, text: 'Eine der schärfsten Eröffnungen überhaupt: Schwarz opfert den Königsflügel für Zentrum und Gegenspiel.' },
    { name: 'Klassisch 4.Lg5', moves: `e4 e6 d4 d5 Nc3 Nf6 Bg5 Be7 e5 Nfd7 Bxe7 Qxe7 f4 O-O Nf3 c5 Bd3 Nc6`, text: 'Weiß tauscht den schwarzen "guten" Läufer und behält Raum.' },
  ],
  konter: { text: `<p>Für Weiß gibt es drei bewährte Wege gegen Französisch:</p><ul><li><b>Vorstoßvariante 3.e5</b> – sofort Raum, einfach zu spielen (eigene Seite).</li><li><b>Tarrasch 3.Sd2</b> – vermeidet die Winawer-Fesselung.</li><li><b>Abtauschvariante 3.exd5</b> – symmetrisch, sicher, eher remislich.</li></ul>`,
    lines: [
      { name: 'Tarrasch 3.Sd2 c5', moves: `e4 e6 d4 d5 Nd2 {Tarrasch – keine Fesselung mit …Lb4 möglich.} c5 exd5 Qxd5 Ngf3 cxd4 Bc4 Qd6 O-O Nf6 Nb3 Nc6 Nbxd4 Nxd4 Nxd4 a6`, text: 'Weiß bekommt einen kleinen Entwicklungsvorsprung, Schwarz hat eine gesunde Struktur.' },
      { name: 'Abtauschvariante 3.exd5', moves: `e4 e6 d4 d5 exd5 exd5 Nf3 Nf6 Bd3 Bd6 O-O O-O Bg5 Bg4 Nbd2 Nbd7 c3 c6`, text: 'Symmetrisch und ruhig – kaum Theorie.' },
    ] },
  traps: [
    { name: 'Falle: Mattangriff mit Lxh7+ (Läuferopfer)', moves: `e4 e6 d4 d5 Nc3 Nf6 e5 Nfd7 Nf3 c5 dxc5 Nc6 Bf4 Bxc5 Bd3 O-O Bxh7+ {Das klassische Läuferopfer!} Kxh7 Ng5+ Kg8 Qh5`, text: 'Das „griechische Geschenk“: Läufer h7, Springer g5, Dame h5 – droht Matt auf h7. Typisch für Stellungen mit weißem Bauern e5 und schwarzer Rochade.' },
  ] },

{ id: 'franzoesisch-vorstoss', group: 'halboffen', name: 'Französisch: Vorstoßvariante', eco: 'C02', side: 'w', start: 5,
  intro: `<p>Weiß antwortet auf die Französische Verteidigung mit <b>3.e5</b> und sichert sich sofort Raum. Der Kampf dreht sich um den Bauern <b>d4</b>, die Basis der weißen Kette. Einfach zu lernen, klare Pläne.</p>`,
  plans: { w: 'd4 mit c3, Sf3, Le2/Ld3 halten. Später Angriff am Königsflügel, da Weiß dort mehr Raum hat.', b: 'Druck auf d4: …c5, …Sc6, …Db6, …Sge7–f5. Oft …cxd4 und …Lb4+.' },
  main: `e4 e6 d4 d5 e5 {Die Vorstoßvariante.} c5 {Sofort gegen die Basis d4.} c3 Nc6 Nf3 Qb6 {Dritter Angreifer auf d4.} a3 {Bereitet b4 vor.} c4 {Schließt den Damenflügel.} Nbd2 Na5 Be2 Bd7 O-O Ne7`,
  vars: [ { name: '5.Ld3 (Milner-Barry-Gambit)', moves: `e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3 Qb6 Bd3 cxd4 cxd4 Bd7 O-O Nxd4 Nxd4 Qxd4 Nc3 Qxe5 Re1 Qd6 Nb5 Qb8 Qf3 Bd6`, text: 'Weiß opfert d4 für einen Angriff – scharf und riskant.' } ],
  konter: { text: '<p>Als Schwarz gegen die Vorstoßvariante: konsequent <b>…c5, …Sc6, …Db6</b> – und auf das Feld f5 für den Springer achten. Der „schlechte“ Läufer c8 kommt oft über d7–b5 zum Tausch.</p>', lines: [] },
  traps: [
    { name: 'Falle: 6.Ld3? cxd4 7.cxd4?? Sxd4!', moves: `e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3 Qb6 Bd3 cxd4 cxd4 Nxd4 Nxd4 Qxd4 {Hier funktioniert die Fesselung nicht – d4 fällt einfach.}`, text: 'Wer das Milner-Barry nicht kennt, verliert einfach den Bauern d4. Achtung bei der Zugfolge!' },
  ] },

{ id: 'carokann', group: 'halboffen', name: 'Caro-Kann-Verteidigung', eco: 'B10–B19', side: 'b', start: 4,
  intro: `<p>Mit <b>1…c6</b> und <b>2…d5</b> greift Schwarz e4 an wie im Französischen – aber der Läufer c8 bleibt frei und kann nach f5 oder g4. Sehr solide, strukturell gesund und eine Favoritin von Karpov, Anand und Carlsen. Ideal als verlässliche Waffe gegen 1.e4.</p>`,
  plans: { w: 'Raum und Entwicklungsvorsprung, oft lange Rochade und Angriff mit h4–h5 gegen den Läufer f5/g6.', b: 'Läufer f5 aktiv, dann …e6, …Sd7, …Sgf6, …Ld6 oder …Le7, Rochade. Gegenspiel mit …c5.' },
  main: `e4 c6 d4 d5 {Caro-Kann.} Nc3 dxe4 Nxe4 Bf5 {Klassische Variante – der Läufer kommt vor …e6 heraus.} Ng3 Bg6 h4 {Weiß greift den Läufer mit dem Bauern an.} h6 Nf3 Nd7 h5 Bh7 Bd3 Bxd3 Qxd3 e6 Bd2 Ngf6 O-O-O Be7`,
  vars: [
    { name: 'Vorstoßvariante 3.e5', moves: `e4 c6 d4 d5 e5 {Vorstoß – Raum für Weiß.} Bf5 {Der Läufer kommt vor …e6 heraus – das ist der Vorteil gegenüber Französisch.} Nf3 e6 Be2 c5 Be3 Nd7 O-O Ne7 c4 dxc4 Na3`, text: 'Das moderne "Short-System": ruhig, aber mit Biss.' },
    { name: '4…Sd7 (Smyslow/Karpow)', moves: `e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nd7 Nf3 Ngf6 Nxf6+ Nxf6 c3 Bg4 Be2 e6 O-O Bd6`, text: 'Bereitet …Sgf6 vor, ohne dass Schwarz Doppelbauern bekommt.' },
  ],
  konter: { text: `<p>Weiß hat gegen Caro-Kann mehrere gute Systeme:</p><ul><li><b>Vorstoß 3.e5</b> – Raum und Initiative (siehe Varianten).</li><li><b>Panov-Angriff 3.exd5 cxd5 4.c4</b> – führt zu Stellungen mit isoliertem Bauern und aktivem Spiel.</li><li><b>Zweispringer 2.Sc3 d5 3.Sf3</b> – flexibel, mit der Idee h3 gegen …Lg4.</li></ul>`,
    lines: [
      { name: 'Panov-Angriff', moves: `e4 c6 d4 d5 exd5 cxd5 c4 {Panov-Botwinnik-Angriff.} Nf6 Nc3 e6 Nf3 Be7 cxd5 Nxd5 Bd3 Nc6 O-O O-O Re1 Bf6`, text: 'Isolierter d-Bauer für Weiß – dafür aktive Figuren und Angriffschancen.' },
      { name: 'Zweispringervariante', moves: `e4 c6 Nc3 d5 Nf3 Bg4 h3 Bxf3 Qxf3 e6 d4 Nf6 Bd3 dxe4 Nxe4 Qxd4 c3 Qd8`, text: 'Weiß bekommt das Läuferpaar gegen eine solide schwarze Stellung.' },
    ] },
  traps: [
    { name: 'Ersticktes Matt: 5.De2 Sgf6?? 6.Sd6#', moves: `e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nd7 Qe2 {Eine Falle!} Ngf6 {Natürlich – aber ein schwerer Fehler.} Nd6#`, text: 'Der Bauer e7 ist an den König gefesselt (Dame e2!) und kann nicht schlagen. Ein berühmtes Matt in der Eröffnung.' },
  ] },

{ id: 'skandinavisch', group: 'halboffen', name: 'Skandinavische Verteidigung', eco: 'B01', side: 'b', start: 3,
  intro: `<p>Schwarz greift e4 sofort mit <b>1…d5</b> an. Nach 2.exd5 Dxd5 steht die Dame früh im Zentrum – gegen die Regeln, aber Schwarz hat eine klare, leicht zu lernende Struktur. Sehr beliebt im Vereinsschach, weil Weiß wenig Ausweichmöglichkeiten hat.</p>`,
  plans: { w: 'Mit Sc3 Tempo gewinnen, schnell entwickeln, d4 im Zentrum.', b: 'Dame nach a5 oder d6, dann …Sf6, …Lf5 (oder …Lg4), …c6, …e6 – solider Aufbau ähnlich wie Caro-Kann.' },
  main: `e4 d5 {Skandinavisch.} exd5 Qxd5 Nc3 {Gewinnt ein Tempo.} Qa5 {Die Hauptlinie.} d4 Nf6 Nf3 Bf5 Bc4 e6 Bd2 c6 Nd5 Qd8 Nxf6+ Qxf6`,
  vars: [
    { name: '3…Dd6 (moderne Linie)', moves: `e4 d5 exd5 Qxd5 Nc3 Qd6 d4 Nf6 Nf3 a6 Be2 Bg4 O-O Nc6`, text: 'Die Dame steht auf d6 sicherer vor Angriffen.' },
    { name: '2…Sf6 (Marshall-Variante)', moves: `e4 d5 exd5 Nf6 d4 Nxd5 c4 Nb6 Nf3 g6 Nc3 Bg7 h3 O-O Be3`, text: 'Schwarz schlägt mit dem Springer zurück – Weiß bekommt viel Raum.' },
  ],
  konter: { text: '<p>Gegen Skandinavisch: <b>3.Sc3</b> (Tempo gegen die Dame) und schnelle Entwicklung. Nach 3…Da5 stellt Weiß den Läufer nach c4 und spielt Ld2 mit Ideen wie Sd5 oder Sb5.</p>', lines: [] },
  traps: [
    { name: 'Falle: Damenfang nach 3…Da5?', moves: `e4 d5 exd5 Qxd5 Nc3 Qa5 d4 Nf6 Nf3 Bg4 h3 Bh5 g4 Bg6 Ne5 e6 h4 {Droht h5 mit Läuferfang.}`, text: 'Der Läufer auf g6 gerät in Gefahr. Schwarz muss hier präzise spielen (z. B. …Lb4 mit Gegenspiel).' },
  ] },

{ id: 'pirc', group: 'halboffen', name: 'Pirc- und Moderne Verteidigung', eco: 'B06–B09', side: 'b', start: 6,
  intro: `<p>Eine <b>hypermoderne</b> Eröffnung: Schwarz überlässt Weiß zunächst das Zentrum und will es später mit Figuren und Bauernhebeln (…c5, …e5) angreifen. Der Läufer auf g7 ist die Hauptwaffe.</p>`,
  plans: { w: 'Großes Zentrum nutzen: Österreichischer Angriff mit f4 oder 150-Angriff (Le3, Dd2, f3, Lh6, h4).', b: 'Fianchetto, kurze Rochade, dann …c5 oder …e5 gegen das Zentrum. Gegenspiel am Damenflügel mit …b5.' },
  main: `e4 d6 d4 Nf6 Nc3 g6 {Pirc-Verteidigung.} f4 {Österreichischer Angriff – sehr ambitioniert.} Bg7 Nf3 c5 {Sofortiger Zentrumsangriff.} dxc5 Qa5 Bd3 Qxc5 Qe2 O-O Be3 Qa5 O-O Bg4`,
  vars: [
    { name: '150-Angriff', moves: `e4 d6 d4 Nf6 Nc3 g6 Be3 c6 Qd2 b5 f3 Nbd7 Bh6 Bxh6 Qxh6 Bb7 Nge2 e5`, text: 'Weiß will den Läufer g7 tauschen und am Königsflügel angreifen.' },
    { name: 'Moderne Verteidigung 1…g6', moves: `e4 g6 d4 Bg7 Nc3 d6 Be3 a6 Qd2 b5 f3 Nd7 h4 h5`, text: 'Noch flexibler: Schwarz wartet mit …Sf6 und kann …b5 früh spielen.' },
  ],
  konter: { text: '<p>Weiß spielt am besten aktiv: entweder <b>f4</b> (Österreichisch) oder der <b>150-Angriff</b> mit Le3/Dd2/Lh6. Ruhige Züge geben Schwarz Zeit für Gegenspiel.</p>', lines: [] },
  traps: [] },

{ id: 'aljechin', group: 'halboffen', name: 'Aljechin-Verteidigung', eco: 'B02–B05', side: 'b', start: 2,
  intro: `<p>Schwarz <b>lockt</b> die weißen Bauern nach vorne: Der Springer wird gejagt, aber jeder Vorstoß schafft Schwächen, die Schwarz später angreift. Benannt nach Weltmeister Alexander Aljechin. Provokant und originell.</p>`,
  plans: { w: 'Raumvorteil ausbauen, aber Schwächen vermeiden. Moderne Variante mit Sf3 ist am solidesten.', b: 'Mit …d6, …Lg4, …e6 und …Sc6 das weiße Zentrum untergraben.' },
  main: `e4 Nf6 {Aljechin-Verteidigung.} e5 Nd5 d4 d6 Nf3 {Moderne Variante.} Bg4 Be2 e6 O-O Be7 c4 Nb6 h3 Bh5 Nc3 O-O Be3 d5`,
  vars: [ { name: 'Vierbauernangriff', moves: `e4 Nf6 e5 Nd5 d4 d6 c4 Nb6 f4 dxe5 fxe5 Nc6 Be3 Bf5 Nc3 e6 Nf3 Be7 d5 exd5 cxd5 Nb4`, text: 'Weiß nimmt alles Zentrum, was es gibt. Schwarz muss sofort kontern.' } ],
  konter: { text: '<p>Weiß spielt am besten die <b>Moderne Variante 4.Sf3</b>: solides Zentrum ohne Übertreibung.</p>', lines: [] },
  traps: [] },

// ======================================================= GESCHLOSSENE SPIELE
{ id: 'damengambit-abgelehnt', group: 'geschlossen', name: 'Damengambit abgelehnt', eco: 'D30–D69', side: 'b', start: 4,
  intro: `<p>Weiß bietet mit <b>2.c4</b> einen Bauern an, um das schwarze Zentrum zu schwächen. Mit <b>2…e6</b> hält Schwarz d5 – die klassischste und solideste Antwort, seit über hundert Jahren in WM-Kämpfen gespielt.</p>`,
  plans: { w: 'Druck auf d5 (Lg5, Tc1, cxd5), Minoritätsangriff mit b4–b5 in der Abtauschvariante.', b: 'Solide Entwicklung, Befreiung mit …c5 oder …e5. Problemfigur: der Läufer c8 – oft mit …b6 und …Lb7 entwickelt.' },
  main: `d4 d5 c4 {Damengambit.} e6 {Abgelehnt – Schwarz hält d5.} Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6 Bh4 b6 {Tartakower-Variante – der Läufer c8 kommt nach b7.} cxd5 Nxd5 Bxe7 Qxe7 Nxd5 exd5 Rc1 Be6`,
  vars: [
    { name: 'Abtauschvariante mit Minoritätsangriff', moves: `d4 d5 c4 e6 Nc3 Nf6 cxd5 exd5 Bg5 Be7 e3 c6 Bd3 Nbd7 Qc2 O-O Nge2 Re8 O-O Nf8 Rab1 a5 a3 Ng6 b4`, text: 'Weiß greift mit zwei Bauern (a/b) gegen drei schwarze (a/b/c) an, um Schwächen zu erzeugen – der Minoritätsangriff.' },
    { name: 'Lf4-System', moves: `d4 d5 c4 e6 Nc3 Nf6 Nf3 Be7 Bf4 O-O e3 c5 dxc5 Bxc5 Qc2 Nc6 a3 Qa5`, text: 'Modern und flexibel.' },
  ],
  konter: { text: '<p>Gegen das Damengambit abgelehnt spielt Weiß oft die <b>Abtauschvariante</b> mit Minoritätsangriff (siehe Varianten) – ein klarer, langfristiger Plan.</p>', lines: [] },
  traps: [
    { name: 'Elefantenfalle', moves: `d4 d5 c4 e6 Nc3 Nf6 Bg5 Nbd7 cxd5 exd5 Nxd5 {Gierig – Weiß glaubt, der Springer f6 sei gefesselt.} Nxd5 Bxd8 {Weiß nimmt die Dame …} Bb4+ {… aber jetzt folgt ein Zwischenschach!} Qd2 Bxd2+ Kxd2 Kxd8`, text: 'Am Ende hat Schwarz eine Leichtfigur mehr. Die Fesselung war nur relativ!' },
  ] },

{ id: 'damengambit-angenommen', group: 'geschlossen', name: 'Damengambit angenommen', eco: 'D20–D29', side: 'b', start: 3,
  intro: `<p>Schwarz nimmt den Bauern c4 – aber nicht, um ihn zu behalten. Schwarz gibt ihn zurück und nutzt die Zeit für Entwicklung und den Hebel …c5. Klare, gesunde Stellungen.</p>`,
  plans: { w: 'Bauern mit e3 und Lxc4 zurückgewinnen, Zentrum mit e4 ausbauen, oft isolierter d-Bauer mit Angriff.', b: '…Sf6, …e6, …c5, …a6 und …b5 – Gegenspiel am Damenflügel.' },
  main: `d4 d5 c4 dxc4 {Angenommen.} Nf3 Nf6 e3 e6 Bxc4 c5 O-O a6 Qe2 b5 Bb3 Bb7 Rd1 Nbd7 Nc3 Qb8`,
  vars: [ { name: '3.e4 (zentral)', moves: `d4 d5 c4 dxc4 e4 e5 Nf3 exd4 Bxc4 Bb4+ Nbd2 Nc6 O-O Nf6 e5 Nd5`, text: 'Weiß nimmt das Zentrum sofort – Schwarz kontert mit …e5.' } ],
  konter: { text: '<p>Weiß sollte nicht versuchen, den Bauern sofort zu decken – einfach mit e3/Lxc4 oder e4 zurückgewinnen.</p>', lines: [] },
  traps: [
    { name: 'Falle: Den Bauern c4 halten wollen', moves: `d4 d5 c4 dxc4 e3 b5 {Schwarz versucht den Bauern zu halten.} a4 c6 axb5 cxb5 Qf3 {Gabel: Turm a8 und Bauer b5? Die Dame zielt auf a8!}`, text: 'Nach Df3 hängt der Turm a8. Lehre: Im angenommenen Damengambit kann Schwarz c4 meist nicht halten.' },
  ] },

{ id: 'slawisch', group: 'geschlossen', name: 'Slawische Verteidigung', eco: 'D10–D19, D43–D49', side: 'b', start: 4,
  intro: `<p>Schwarz deckt d5 mit <b>2…c6</b> statt …e6 – so bleibt der Läufer c8 frei. Sehr solide und eine der beliebtesten Verteidigungen auf Großmeisterniveau. Die <b>Halbslawische Verteidigung</b> (mit …e6 und …c6) ist eine dynamischere Schwester.</p>`,
  plans: { w: 'Bauern c4 zurückgewinnen, Zentrum mit e4 durchsetzen.', b: 'Läufer nach f5/g4 vor …e6, später …c5 oder …e5 als Befreiung.' },
  main: `d4 d5 c4 c6 {Slawisch.} Nf3 Nf6 Nc3 dxc4 a4 {Verhindert …b5.} Bf5 {Der Läufer kommt heraus.} e3 e6 Bxc4 Bb4 O-O O-O Qe2 Nbd7 e4 Bg6`,
  vars: [
    { name: 'Halbslawisch: Meraner Variante', moves: `d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 e3 Nbd7 Bd3 dxc4 Bxc4 b5 Bd3 Bb7 O-O a6 e4 c5 d5 Qc7`, text: 'Scharfes Gegenspiel am Damenflügel.' },
    { name: 'Abtauschvariante', moves: `d4 d5 c4 c6 cxd5 cxd5 Nc3 Nf6 Bf4 Nc6 e3 Bf5 Nf3 e6 Bb5 Nd7`, text: 'Symmetrische, ruhige Stellungen.' },
  ],
  konter: { text: '<p>Gegen Slawisch kann Weiß ruhig mit <b>3.Sf3/4.e3</b> spielen oder mit der <b>Abtauschvariante</b> eine sichere Stellung anstreben.</p>', lines: [] },
  traps: [] },

{ id: 'londoner', group: 'geschlossen', name: 'Londoner System', eco: 'D02, A46–A48', side: 'w', start: 3,
  intro: `<p>Das <b>Londoner System</b> ist ein Aufbau, kein Zugfolgen-Auswendiglernen: d4, Lf4, e3, c3, Sf3, Ld3, Sbd2, h3. Weiß spielt fast immer dieselben Züge – egal, was Schwarz macht. Perfekt für alle, die wenig Theorie lernen wollen; Carlsen spielt es auch.</p>`,
  plans: { w: 'Pyramide c3–d4–e3, Läufer f4 vor e3 entwickeln (sonst ist er eingesperrt). Später Se5 und Angriff am Königsflügel, oder Spiel im Zentrum.', b: 'Mit …c5 und …Db6 Druck auf b2/d4, oder …Ld6 zum Läufertausch.' },
  main: `d4 d5 Bf4 {Das Londoner System – der Läufer kommt vor e3 heraus.} Nf6 e3 c5 c3 Nc6 Nd2 e6 Ngf3 Bd6 Bg3 O-O Bd3 b6 Ne5 Bb7`,
  vars: [ { name: 'Gegen den Königsinder-Aufbau', moves: `d4 Nf6 Bf4 g6 e3 Bg7 Nf3 O-O Be2 d6 h3 c5 c3 b6 O-O Bb7`, text: 'Auch gegen …g6 bleibt Weiß beim Aufbau.' } ],
  konter: { text: `<p>Die gefährlichste Antwort für Schwarz: <b>…c5 und …Db6</b>, um b2 anzugreifen, bevor Weiß sicher steht. Eine weitere Idee ist <b>…Ld6</b>, um den starken Londoner Läufer zu tauschen.</p>`,
    lines: [ { name: 'Schwarz: …c5 und …Db6', moves: `d4 d5 Bf4 c5 e3 Nc6 c3 Qb6 Qb3 c4 Qc2 Bf5 Qc1 e6 Nf3 Nf6 Nbd2 Nh5 {Jagt den starken Londoner Läufer.}`, text: 'Schwarz drängt die weiße Dame zurück und bekommt aktives Spiel.' } ] },
  traps: [] },

{ id: 'albin', group: 'geschlossen', name: 'Albins Gegengambit', eco: 'D08–D09', side: 'b', start: 4,
  intro: `<p>Gegen das Damengambit schlägt Schwarz mit <b>2…e5</b> zurück und opfert einen Bauern. Der Bauer d4 wird zum Dorn in der weißen Stellung. Ein Überraschungsgambit mit einer berühmten Falle.</p>`,
  plans: { w: 'Bauern behalten, schnell mit Sf3, g3, Lg2 entwickeln, den Bauern d4 einkreisen.', b: 'Lange Rochade, …Lg4, …Sge7 – Angriff mit dem Bauernkeil d4.' },
  main: `d4 d5 c4 e5 {Albins Gegengambit.} dxe5 d4 Nf3 Nc6 g3 Be6 Nbd2 Qd7 Bg2 O-O-O O-O Bh3`,
  vars: [],
  konter: { text: '<p>Weiß spielt am sichersten <b>Sf3, g3, Lg2</b> und vermeidet e3 – damit fällt die Lasker-Falle weg.</p>', lines: [] },
  traps: [
    { name: 'Lasker-Falle (Unterverwandlung!)', moves: `d4 d5 c4 e5 dxe5 d4 e3 {Ein natürlicher Fehler.} Bb4+ Bd2 dxe3 Bxb4 exf2+ Ke2 fxg1=N+ {Unterverwandlung in einen Springer mit Schach!} Ke1 Qh4+`, text: 'Eine der berühmtesten Fallen: Der Bauer frisst sich durch und wird zum Springer – Schwarz gewinnt.' },
  ] },

// ======================================================= INDISCHE
{ id: 'koenigsindisch', group: 'indisch', name: 'Königsindische Verteidigung', eco: 'E60–E99', side: 'b', start: 6,
  intro: `<p>Schwarz überlässt Weiß das Zentrum und schlägt später mit <b>…e5</b> zurück. Oft wird das Zentrum geschlossen, und beide Seiten greifen auf verschiedenen Flügeln an: Weiß am Damenflügel, Schwarz mit …f5 am Königsflügel. Die Lieblingswaffe von Fischer und Kasparov.</p>`,
  plans: { w: 'Raumvorteil, Angriff am Damenflügel mit c5 (b4, Sd2–c4).', b: 'Nach d5: Springer nach e8/d7, dann …f5–f4 und …g5 – direkter Königsangriff.' },
  main: `d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 {Königsindisch.} Nf3 O-O Be2 e5 {Der typische Zentrumskonter.} O-O Nc6 d5 Ne7 {Klassische Hauptvariante (Mar del Plata).} Ne1 Nd7 Nd3 f5 Bd2 Nf6 f3 f4`,
  vars: [
    { name: 'Sämisch-Variante 5.f3', moves: `d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 f3 O-O Be3 e5 d5 Nh5 Qd2 f5 O-O-O Nd7`, text: 'Weiß sichert e4 und plant oft lange Rochade mit Königsangriff.' },
    { name: 'Vierbauernangriff', moves: `d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 f4 O-O Nf3 c5 d5 e6 Be2 exd5 cxd5 Re8`, text: 'Weiß baut ein riesiges Zentrum – Schwarz muss es sofort untergraben.' },
  ],
  konter: { text: '<p>Für Weiß sind die <b>Klassische Variante</b> (Hauptlinie) und die <b>Sämisch-Variante</b> die besten Wege. Ein einfacheres System ist das <b>Londoner System</b> bzw. ein Fianchetto mit g3.</p>', lines: [] },
  traps: [] },

{ id: 'gruenfeld', group: 'indisch', name: 'Grünfeld-Indische Verteidigung', eco: 'D70–D99', side: 'b', start: 6,
  intro: `<p>Schwarz lässt Weiß ein großes Bauernzentrum bauen – und greift es dann mit Figuren und <b>…c5</b> an. Der Läufer g7 schießt über die lange Diagonale auf d4. Sehr dynamisch, viel Theorie.</p>`,
  plans: { w: 'Zentrum halten (c3/d4/e4), kurz rochieren, d5 vorstoßen oder am Königsflügel angreifen.', b: 'Druck auf d4 mit …c5, …Sc6, …Lg4 und …Da5. Spiel am Damenflügel.' },

// ===== Eröffnungen: Daten aufbereiten =====
const OPS = OPENINGS.map(o => {
  const lines = [];
  const add = (key, kind, name, text, moves) => {
    const p = Chess.parseLine(moves);
    lines.push({ key, kind, name, text, moves: p.moves, end: p.end });
  };
  add('main', 'main', 'Hauptvariante', '', o.main);
  o.vars.forEach((v, i) => add('v' + i, 'var', v.name, v.text, v.moves));
  o.konter.lines.forEach((v, i) => add('k' + i, 'konter', v.name, v.text, v.moves));
  o.traps.forEach((v, i) => add('t' + i, 'trap', v.name, v.text, v.moves));
  // Standard-Übungsseite
  lines.forEach(l => {
    if (l.kind === 'main' || l.kind === 'var') l.side = o.side;
    else if (l.kind === 'konter') l.side = Chess.other(o.side);
    else l.side = l.moves.length % 2 ? 'w' : 'b'; // wer den letzten Zug macht
  });
  return Object.assign({}, o, { lines });
});
const OP_BY_ID = Object.fromEntries(OPS.map(o => [o.id, o]));
const opKey = (o, l) => `opl:${o.id}:${l.key}`;
const opTrained = o => o.lines.filter(l => progress[opKey(o, l)]).length;
const totalLines = OPS.reduce((a, o) => a + o.lines.length, 0);

// ---------- Eröffnungsbaum für den Explorer ----------
const TREE = new Map(); // posKey -> { label, opId, next: Map(uci -> {m, san, names:Set, trap, note}) }
(function buildTree() {
  const node = k => { if (!TREE.has(k)) TREE.set(k, { label: null, opId: null, next: new Map() }); return TREE.get(k); };
  const insert = (o, l, label, from) => {
    l.moves.forEach((x, i) => {
      const n = node(Chess.posKey(x.before));
      const u = Chess.uci(x.m);
      const isNew = !n.next.has(u);
      if (isNew) n.next.set(u, { m: x.m, san: x.san, names: new Set(), trap: false, note: '' });
      const e = n.next.get(u);
      if (l.kind === 'trap') { if (isNew) { e.trap = true; e.names.add(l.name); } }
      else { e.trap = false; e.names.add(o.name); }
      if (x.note && !e.note) e.note = x.note;
      const after = node(Chess.posKey(i + 1 < l.moves.length ? l.moves[i + 1].before : l.end));
      if (i + 1 >= from && !after.label && l.kind !== 'trap') { after.label = label; after.opId = o.id; }
    });
  };
  // Grundnamen zuerst
  for (const [seq, name] of Object.entries(BASE_NAMES)) {
    const p = Chess.parseLine(seq);
    const n = node(Chess.posKey(p.end)); n.label = name;
  }
  for (const o of OPS) insert(o, o.lines[0], o.name, o.start);
  for (const o of OPS) for (const l of o.lines.slice(1)) {
    const main = o.lines[0].moves;
    let d = 0; while (d < l.moves.length && d < main.length && Chess.uci(l.moves[d].m) === Chess.uci(main[d].m)) d++;
    insert(o, l, l.kind === 'konter' ? `${o.name}: ${l.name}` : `${o.name} – ${l.name}`, Math.max(d + 1, o.start));
  }
})();

// ---------- Navigation (Eröffnungen) ----------
function renderOpNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  const search = h('input', 'nav-search'); search.type = 'search'; search.placeholder = 'Eröffnung suchen …';
  search.value = opSearch;
  search.oninput = () => { opSearch = search.value; renderList(); };
  nav.appendChild(search);
  const top = h('div', 'nav-ch');
  [['eroeffnungen', '🧭 Übersicht & Konter-Tabelle'], ['explorer', '🔍 Eröffnungs-Explorer'], ['spielen', '♞ Gegen den Computer spielen']].forEach(([id, t]) => {
    const a = h('a', 'nav-l' + (curRoute === id ? ' cur' : ''), `<span class="chk"></span><span>${t}</span>`); a.href = '#' + id; top.appendChild(a);
  });
  nav.appendChild(top);
  const list = h('div'); nav.appendChild(list);
  function renderList() {
    list.innerHTML = '';
    const q = opSearch.trim().toLowerCase();
    OPENING_GROUPS.forEach(g => {
      const ops = OPS.filter(o => o.group === g.id && (!q || (o.name + ' ' + o.eco).toLowerCase().includes(q)));
      if (!ops.length) return;
      const sec = h('div', 'nav-ch');
      sec.appendChild(h('div', 'nav-ch-title', `<span>${g.title}</span>`));
      ops.forEach(o => {
        const t = opTrained(o), all = o.lines.length;
        const a = h('a', 'nav-l' + (curRoute === 'op-' + o.id ? ' cur' : '') + (t === all ? ' done' : ''),
          `<span class="chk">${t === all ? '✓' : ''}</span><span class="grow">${o.name}<small class="side-tag ${o.side}">${o.side === 'w' ? 'Weiß' : 'Schwarz'}</small></span><span class="nav-count">${t}/${all}</span>`);
        a.href = '#op-' + o.id; sec.appendChild(a);
      });
      list.appendChild(sec);
    });
    if (!list.children.length) list.appendChild(h('p', 'muted small', '&nbsp;&nbsp;Nichts gefunden.'));
  }
  renderList();
  const done = OPS.reduce((a, o) => a + opTrained(o), 0);
  $('#prog-fill').style.width = (100 * done / totalLines) + '%';
  $('#prog-text').textContent = `${done} von ${totalLines} Linien geübt`;
}

function openOpening(id) {
  const o = OP_BY_ID[id];
  if (!o) return openOverview();
  const main = $('#main'); main.innerHTML = '';
  const grp = OPENING_GROUPS.find(g => g.id === o.group);
  main.appendChild(h('div', 'lhead', `<div class="crumb">${grp.title}</div><h1>${o.name}</h1>
    <div class="tags"><span class="tag">ECO ${o.eco}</span><span class="tag side-tag ${o.side}">Wahl von ${o.side === 'w' ? 'Weiß' : 'Schwarz'}</span><span class="tag">Startzüge: ${o.lines[0].moves.slice(0, o.start).map((x, i) => (i % 2 ? '' : (i / 2 + 1) + '.') + x.san).join(' ')}</span></div>`));
  const body = h('div', 'lbody has-w op');
  const left = h('div', 'ltext prose');
  left.innerHTML = o.intro + `<div class="plans"><div class="plan w"><b>Pläne für Weiß</b><p>${o.plans.w}</p></div><div class="plan b"><b>Pläne für Schwarz</b><p>${o.plans.b}</p></div></div>`;
  const lineList = h('div', 'linelist');
  const sections = [['main', 'Hauptvariante'], ['var', 'Varianten'], ['konter', 'Konter – so bekämpft man sie'], ['trap', 'Fallen']];
  const right = h('div', 'lwidget');
  let current = o.lines[0];
  for (const [kind, title] of sections) {
    const ls = o.lines.filter(l => l.kind === kind);
    if (kind === 'konter') {
      lineList.appendChild(h('h3', '', title));
      lineList.appendChild(h('div', 'konter-text', o.konter.text));
      if (!ls.length) continue;
    } else {
      if (!ls.length) continue;
      lineList.appendChild(h('h3', '', title));
    }
    ls.forEach(l => {
      const b = h('button', 'linecard' + (l === current ? ' cur' : ''), '');
      b.dataset.key = l.key;
      const prev = l.moves.slice(0, 8).map((x, i) => (i % 2 ? '' : (i / 2 + 1) + '.') + x.san).join(' ') + (l.moves.length > 8 ? ' …' : '');
      b.innerHTML = `<span class="lc-top"><span class="lc-name">${l.kind === 'trap' ? '⚠️ ' : ''}${l.name}</span><span class="lc-ok">${progress[opKey(o, l)] ? '✓ geübt' : ''}</span></span><span class="lc-moves">${prev}</span>`;
      b.onclick = () => { current = l; $$('.linecard', lineList).forEach(x => x.classList.toggle('cur', x.dataset.key === l.key)); showViewer(); if (window.innerWidth < 980) right.scrollIntoView({ behavior: 'smooth' }); };
      lineList.appendChild(b);
    });
  }
  left.appendChild(lineList);
  body.append(left, right);
  main.appendChild(body);
  function showViewer() { right.innerHTML = ''; lineViewer(right, o, current, () => { $$('.linecard', lineList).forEach(x => { const l = o.lines.find(y => y.key === x.dataset.key); $('.lc-ok', x).textContent = progress[opKey(o, l)] ? '✓ geübt' : ''; }); renderNav(); }); }
  showViewer();
  window.scrollTo(0, 0);
}

function lineViewer(host, o, line, onTrained) {
  const wrap = h('div', 'wbox viewer');
  const title = h('div', 'v-title', `${line.kind === 'trap' ? '⚠️ ' : ''}<b>${line.name}</b>`);
  const modeSeg = h('div', 'seg small-seg');
  const sideSeg = h('div', 'seg small-seg');
  const sideRow = h('div', 'v-row', '<span class="muted small">Üben als:</span>'); sideRow.appendChild(sideSeg);
  const status = h('div', 'status');
  const bd = h('div');
  const note = h('div', 'feedback info v-note');
  const bar = h('div', 'btnrow');
  const b0 = h('button', 'btn ghost', '⏮'), bp = h('button', 'btn ghost', '◀'), bn = h('button', 'btn', '▶'), be = h('button', 'btn ghost', '⏭'), bf = h('button', 'btn ghost', '⇅');
  bar.append(b0, bp, bn, be, bf);
  const ml = h('div', 'v-moves');
  const playB = h('button', 'btn ghost small-btn', '♞ Ab Ende dieser Linie gegen den Computer spielen');
  wrap.append(title, h('div', 'v-row', ''), status, bd, note, bar, ml, playB);
  $$('.v-row', wrap)[0].appendChild(modeSeg); wrap.insertBefore(sideRow, status);
  host.appendChild(wrap);

  let mode = 'view', side = line.side, idx = 0, errors = 0, busy = false, done = false;
  const states = [line.moves.length ? line.moves[0].before : line.end].concat(line.moves.map((x, i) => i + 1 < line.moves.length ? line.moves[i + 1].before : line.end));
  const board = new Board(bd, {
    interactive: true,
    canSelect: (sq, p) => mode === 'train' && !busy && !done && board.state.turn === side && Chess.colorOf(p) === side,
    getMoves: sq => Chess.legalMoves(board.state).filter(m => m.from === sq),
    onMove: m => trainMove(m),
  });
  board.flip = side === 'b';

  function seg(el, items, cur, cb) { el.innerHTML = ''; items.forEach(([v, t]) => { const b = h('button', v === cur ? 'on' : '', t); b.onclick = () => cb(v); el.appendChild(b); }); }
  function renderSegs() {
    seg(modeSeg, [['view', '👁 Ansehen'], ['train', '🎯 Üben']], mode, v => { mode = v; reset(); });
    seg(sideSeg, [['w', 'Weiß'], ['b', 'Schwarz']], side, v => { side = v; board.flip = side === 'b'; reset(); });
    sideRow.style.display = mode === 'train' ? '' : 'none';
    bar.style.display = mode === 'view' ? '' : 'none';
  }
  function show() {
    board.arrows = [];
    board.last = idx ? line.moves[idx - 1].m : null;
    board.set(states[idx]);
    // Notiz
    if (mode === 'view') {
      if (!idx) note.innerHTML = line.text ? line.text : '<span class="muted">Mit ▶ durch die Züge klicken (oder auf einen Zug in der Liste tippen).</span>';
      else {
        const x = line.moves[idx - 1];
        const num = x.before.full + (x.before.turn === 'w' ? '.' : '…');
        let t = `<b class="mv">${num} ${x.san}</b> ${x.note || ''}`;
        if (idx === line.moves.length && line.text) t += `<div class="v-sum">${line.text}</div>`;
        note.innerHTML = t;
      }
      status.innerHTML = `Zug ${Math.ceil(idx / 2)} · ${idx}/${line.moves.length} Halbzüge`;
      b0.disabled = bp.disabled = !idx; bn.disabled = be.disabled = idx >= line.moves.length;
    }
    renderMoves();
  }
  function renderMoves() {
    let html = '';
    const lim = mode === 'view' ? line.moves.length : idx;
    for (let i = 0; i < lim; i++) {
      const x = line.moves[i];
      if (x.before.turn === 'w' || i === 0) html += `<span class="n">${x.before.full}.${x.before.turn === 'b' ? '…' : ''}</span>`;
      html += `<span class="mvl${i + 1 === idx ? ' cur' : ''}${x.note ? ' has-note' : ''}" data-i="${i + 1}">${x.san}</span>`;
    }
    ml.innerHTML = html;
    if (mode === 'view') $$('.mvl', ml).forEach(s => s.onclick = () => { idx = +s.dataset.i; show(); });
  }
  function reset() {
    idx = 0; errors = 0; done = false; busy = false;
    renderSegs(); show();
    if (mode === 'train') {
      note.className = 'feedback info v-note';
      note.innerHTML = `Spiele die Züge von <b>${side === 'w' ? 'Weiß' : 'Schwarz'}</b> aus dem Gedächtnis. Der Computer spielt die Gegenzüge. Nach zwei Fehlern zeige ich dir den Buchzug.`;
      status.innerHTML = '';
      setTimeout(autoplay, 400);
    } else note.className = 'feedback info v-note';
  }
  async function autoplay() {
    while (mode === 'train' && idx < line.moves.length && states[idx].turn !== side) {
      busy = true; await sleep(450);
      if (mode !== 'train') return;
      idx++; show();
      const x = line.moves[idx - 1];
      if (x.note) { note.className = 'feedback info v-note'; note.innerHTML = `<b class="mv">${x.san}</b> ${x.note}`; }
    }
    busy = false;
    if (mode === 'train' && idx >= line.moves.length) finish();
    else if (mode === 'train') status.innerHTML = `<span class="side ${side}"></span><b>Du bist am Zug.</b>`;
  }
  function trainMove(m) {
    const exp = line.moves[idx].m;
    if (Chess.uci(m) === Chess.uci(exp)) {
      idx++; errors = 0; show();
      const x = line.moves[idx - 1];
      note.className = 'feedback ok v-note';
      note.innerHTML = `<b>✓ ${x.san}</b> ${x.note || ''}`;
      autoplay();
    } else {
      errors++;
      board.last = m; board.set(Chess.makeMove(board.state, m)); board.flashSq(m.to, 'bad', 600);
      busy = true;
      setTimeout(() => {
        busy = false; show();
        note.className = 'feedback bad v-note';
        if (errors >= 2) {
          board.arrows = [Chess.uci(exp).slice(0, 4)]; board.render();
          note.innerHTML = `Nicht ganz. Der Buchzug ist <b>${line.moves[idx].san}</b> (siehe Pfeil). Spiel ihn nach.`;
        } else note.innerHTML = 'Das ist nicht der Zug aus dieser Linie. Versuch es nochmal!';
      }, 650);
    }
  }
  function finish() {
    done = true;
    progress[opKey(o, line)] = true; saveProgress();
    note.className = 'feedback ok v-note';
    note.innerHTML = `<b>🎉 Linie geschafft!</b> ${line.text || ''} <div class="small" style="margin-top:.4em">Spiel sie ruhig noch ein paar Mal – oder probier sie mit der anderen Farbe.</div>`;
    status.innerHTML = '';
    onTrained && onTrained();
  }
  b0.onclick = () => { idx = 0; show(); };
  bp.onclick = () => { if (idx) { idx--; show(); } };
  bn.onclick = () => { if (idx < line.moves.length) { idx++; show(); } };
  be.onclick = () => { idx = line.moves.length; show(); };
  bf.onclick = () => { board.flip = !board.flip; board.render(); };
  playB.onclick = () => { playFrom = { name: `${o.name} – ${line.name}`, moves: line.moves.map(x => Chess.uci(x.m)) }; go('spielen'); };
  reset();
}

// ---------- Explorer ----------
let explorerPath = [];
function openExplorer() {
  const main = $('#main'); main.innerHTML = '';
  main.appendChild(h('div', 'lhead', `<div class="crumb">Eröffnungen</div><h1>Eröffnungs-Explorer</h1>`));
  const body = h('div', 'lbody has-w play');
  const wh = h('div', 'lwidget');
  const side = h('div', 'ltext');
  const name = h('div', 'ex-name');
  const bd = h('div');
  const bar = h('div', 'btnrow');
  const backB = h('button', 'btn ghost', '◀ Zurück'), resetB = h('button', 'btn ghost', '⟲ Grundstellung'), flipB = h('button', 'btn ghost', '⇅ Drehen'), engB = h('button', 'btn ghost', '🤖 Engine-Vorschlag');
  bar.append(backB, resetB, flipB, engB);
  const note = h('div', 'feedback');
  wh.append(name, bd, note, bar);
  const bookCard = h('div', 'card');
  const pathCard = h('div', 'card movelist');
  side.append(h('p', 'muted small', 'Spiele beliebige Züge auf dem Brett (beide Farben) oder tippe auf einen Buchzug. Der Explorer zeigt dir, in welcher Eröffnung du bist und was die Theorie empfiehlt.'), bookCard, pathCard);
  body.append(wh, side);
  main.appendChild(body);
  let state;
  const board = new Board(bd, {
    interactive: true,
    canSelect: (sq, p) => Chess.colorOf(p) === state.turn,
    getMoves: sq => Chess.legalMoves(state).filter(m => m.from === sq),
    onMove: m => { explorerPath.push(Chess.uci(m)); render(); },
  });
  function render() {
    state = Chess.parseFEN(START_FEN);
    let label = 'Grundstellung', opId = null, lastNote = '', lastSan = [];
    const sans = [];
    for (const u of explorerPath) {
      const n = TREE.get(Chess.posKey(state));
      const m = Chess.findUci(state, u);
      if (!m) break;
      sans.push(Chess.san(state, m));
      lastNote = n && n.next.get(u) ? n.next.get(u).note : '';
      state = Chess.makeMove(state, m);
      const n2 = TREE.get(Chess.posKey(state));
      if (n2 && n2.label) { label = n2.label; opId = n2.opId; }
    }
    board.last = null;
    board.arrows = [];
    board.set(state);
    const node = TREE.get(Chess.posKey(state));
    const inBook = !!node;
    name.innerHTML = `<div class="crumb">${inBook ? 'Aktuelle Eröffnung' : 'Außerhalb der Theorie'}</div><div class="ex-title">${label}</div>` + (opId ? `<a class="small" href="#op-${opId}">Zur Eröffnungsseite →</a>` : '');
    note.className = lastNote ? 'feedback info' : 'feedback';
    note.innerHTML = lastNote ? `<b class="mv">${sans[sans.length - 1]}</b> ${lastNote}` : '';
    // Buchzüge
    let bh = `<div class="ml-title">Buchzüge (${state.turn === 'w' ? 'Weiß' : 'Schwarz'} am Zug)</div>`;
    if (node && node.next.size) {
      bh += '<div class="book">';
      for (const [u, e] of node.next) {
        const names = [...e.names].slice(0, 3).join(', ');
        bh += `<button class="bookmove${e.trap ? ' trap' : ''}" data-u="${u}"><b>${e.san}</b><span>${e.trap ? '⚠️ Falle · ' : ''}${names}</span></button>`;
      }
      bh += '</div>';
    } else bh += `<p class="small muted">${explorerPath.length ? 'Keine Buchzüge mehr – hier endet die Theorie in dieser App. Ab jetzt zählen die Prinzipien: Entwicklung, Zentrum, Königssicherheit.' : ''}</p>`;
    bookCard.innerHTML = bh;
    $$('.bookmove', bookCard).forEach(b => b.onclick = () => { explorerPath.push(b.dataset.u); render(); });
    // Pfad
    let ph = '<div class="ml-title">Gespielte Züge</div>';
    if (sans.length) { ph += '<div class="ml">'; sans.forEach((s, i) => { if (i % 2 === 0) ph += `<span class="n">${i / 2 + 1}.</span>`; ph += `<span class="mvl" data-i="${i + 1}">${s}</span>`; }); ph += '</div>'; }
    else ph += '<p class="muted small">Noch keine Züge.</p>';
    pathCard.innerHTML = ph;
    $$('.mvl', pathCard).forEach(s => s.onclick = () => { explorerPath = explorerPath.slice(0, +s.dataset.i); render(); });
    if (explorerPath.length) { let s = Chess.parseFEN(START_FEN); let m; for (const u of explorerPath) { m = Chess.findUci(s, u); s = Chess.makeMove(s, m); } board.last = m; board.render(); }
    backB.disabled = !explorerPath.length;
  }
  backB.onclick = () => { explorerPath.pop(); render(); };
  resetB.onclick = () => { explorerPath = []; render(); };
  flipB.onclick = () => { board.flip = !board.flip; board.render(); };
  engB.onclick = async () => {
    engB.disabled = true; note.className = 'feedback info'; note.innerHTML = 'Engine rechnet …'; await sleep(30);
    const r = Chess.search(state, 4, 1500);
    engB.disabled = false;
    if (!r) { note.innerHTML = 'Keine Züge möglich.'; return; }
    board.arrows = [Chess.uci(r.move).slice(0, 4)]; board.render();
    const sc = (state.turn === 'w' ? r.score : -r.score) / 100;
    note.innerHTML = `Engine-Vorschlag: <b>${Chess.san(state, r.move)}</b> · Bewertung ${sc > 0 ? '+' : ''}${sc.toFixed(1)} (aus Sicht von Weiß). <span class="muted small">Die eingebaute Engine ist einfach – für Eröffnungen sind die Buchzüge verlässlicher.</span>`;
  };
  render();
  window.scrollTo(0, 0);
}

const $ = (s, r = document) => r.querySelector(s);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const NAME_DE = { k: 'König', q: 'Dame', r: 'Turm', b: 'Läufer', n: 'Springer', p: 'Bauer' };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- Speicher ----------
const STORE_KEY = 'schach-lernen-v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }

// ---------- Brett ----------
class Board {
  constructor(el, o = {}) {
    this.el = el; this.o = o;
    this.flip = !!o.flip; this.state = null; this.sel = null; this.targets = [];
    this.marks = {}; this.arrows = []; this.stars = new Set(); this.last = null; this.flash = {};
    el.classList.add('board-wrap');
    el.innerHTML = '<div class="board"></div><svg class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg><div class="promo hidden"></div>';
    this.bEl = $('.board', el); this.svg = $('.arrows', el); this.promoEl = $('.promo', el);
    this.bEl.addEventListener('click', e => { const sq = e.target.closest('[data-sq]'); if (sq) this.click(+sq.dataset.sq); });
  }
  set(state) { this.state = state; this.sel = null; this.targets = []; this.render(); }
  click(sq) {
    if (!this.promoEl.classList.contains('hidden')) return;
    if (this.o.onSquare) { this.o.onSquare(sq); return; }
    if (!this.o.interactive || !this.state) return;
    if (this.sel !== null) {
      const ms = this.targets.filter(m => m.to === sq);
      if (ms.length) {
        if (ms.length > 1 && ms[0].promo) this.askPromo(ms);
        else this.done(ms[0]);
        return;
      }
    }
    const p = this.state.b[sq];
    if (p && sq !== this.sel && (!this.o.canSelect || this.o.canSelect(sq, p))) {
      this.sel = sq; this.targets = this.o.getMoves ? this.o.getMoves(sq) : [];
    } else { this.sel = null; this.targets = []; }
    this.render();
  }
  done(m) { this.sel = null; this.targets = []; this.o.onMove && this.o.onMove(m); }
  askPromo(ms) {
    const white = Chess.colorOf(ms[0].piece) === 'w';
    this.promoEl.innerHTML = '<div class="promo-box"><div class="promo-title">Umwandeln in:</div><div class="promo-opts"></div></div>';
    for (const t of 'qrbn') {
      const b = h('button', 'promo-btn ' + (white ? 'pw' : 'pb'), `<span class="pc">${GLYPH[t]}︎</span><small>${NAME_DE[t]}</small>`);
      b.onclick = () => { this.promoEl.classList.add('hidden'); this.done(ms.find(m => m.promo === t)); };
      $('.promo-opts', this.promoEl).appendChild(b);
    }
    this.promoEl.classList.remove('hidden');
  }
  render() {
    const s = this.state, b = s ? s.b : Array(64).fill(null);
    const checkSq = new Set();
    if (s) for (const c of ['w', 'b']) { const k = Chess.findKing(b, c); if (k >= 0 && Chess.attacked(b, k, Chess.other(c))) checkSq.add(k); }
    const tset = new Map(this.targets.map(m => [m.to, m]));
    let html = '';
    for (let d = 0; d < 64; d++) {
      const i = this.flip ? 63 - d : d;
      const r = Math.floor(i / 8), f = i % 8;
      const light = (r + f) % 2 === 0;
      let cls = 'sq ' + (light ? 'l' : 'd');
      if (this.last && (this.last.from === i || this.last.to === i)) cls += ' last';
      if (this.sel === i) cls += ' sel';
      if (this.marks[Chess.sqName(i)]) cls += ' m-' + this.marks[Chess.sqName(i)];
      if (this.flash[i]) cls += ' f-' + this.flash[i];
      if (checkSq.has(i)) cls += ' check';
      if (this.o.interactive && b[i] && (!this.o.canSelect || this.o.canSelect(i, b[i]))) cls += ' movable';
      let inner = '';
      const showRank = this.flip ? f === 7 : f === 0, showFile = this.flip ? r === 0 : r === 7;
      if (showRank) inner += `<span class="cr">${8 - r}</span>`;
      if (showFile) inner += `<span class="cf">${Chess.FILES[f]}</span>`;
      if (this.stars.has(i)) inner += '<span class="star">★</span>';
      if (b[i]) inner += `<span class="pc ${b[i] === b[i].toUpperCase() ? 'pw' : 'pb'}">${GLYPH[b[i].toLowerCase()]}︎</span>`;
      if (tset.has(i)) inner += `<span class="${b[i] || tset.get(i).ep ? 'ring' : 'dot'}"></span>`;
      html += `<div class="${cls}" data-sq="${i}" aria-label="${Chess.sqName(i)}">${inner}</div>`;
    }
    this.bEl.innerHTML = html;
    // Pfeile
    let svg = '<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>';
    for (const a of this.arrows) {
      const p = sq => { const i = Chess.sqIdx(sq), d = this.flip ? 63 - i : i; return [d % 8 + 0.5, Math.floor(d / 8) + 0.5]; };
      const [x1, y1] = p(a.slice(0, 2)), [x2, y2] = p(a.slice(2, 4));
      const len = Math.hypot(x2 - x1, y2 - y1), k = (len - 0.35) / len;
      svg += `<line x1="${x1}" y1="${y1}" x2="${x1 + (x2 - x1) * k}" y2="${y1 + (y2 - y1) * k}" stroke="currentColor" stroke-width="0.16" stroke-linecap="round" marker-end="url(#ah)" opacity="0.85"/>`;
    }
    this.svg.innerHTML = svg;
  }
  flashSq(i, kind, ms = 600) { this.flash[i] = kind; this.render(); setTimeout(() => { delete this.flash[i]; this.render(); }, ms); }
}

function sideLabel(c) { return c === 'w' ? 'Weiß' : 'Schwarz'; }
function moveCount(n) { return n === 1 ? '1 Zug' : n + ' Züge'; }

    bar.appendChild(h('span', 'muted small', 'Tippe eine Figur an und ziehe sie.'));
    bar.appendChild(reset); wrap.appendChild(bar);
