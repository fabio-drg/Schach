Widgets.coords = (host, w, ctx) => {
  const wrap = h('div', 'wbox');
  const top = h('div', 'coord-top');
  const target = h('div', 'coord-target', '–');
  const info = h('div', 'muted small', '');
  top.append(target, info);
  const bd = h('div');
  const bar = h('div', 'btnrow');
  const startBtn = h('button', 'btn', 'Start');
  const flipBtn = h('button', 'btn ghost', '⇅ Brett drehen');
  bar.append(startBtn, flipBtn);
  wrap.append(top, bd, bar);
  let round = 0, score = 0, cur = -1, running = false;
  const board = new Board(bd, { onSquare: sq => {
    if (!running) return;
    if (sq === cur) { score++; board.flashSq(sq, 'ok', 350); } else { board.flashSq(sq, 'bad', 500); board.flashSq(cur, 'ok', 900); }
    next();
  } });
  board.set(Chess.parseFEN('8/8/8/8/8/8/8/8 w - - 0 1'));
  function next() {
    round++;
    if (round > w.rounds) {
      running = false;
      const ok = score >= w.need;
      target.textContent = `${score} / ${w.rounds}`;
      info.innerHTML = ok ? '<b class="good">Super! Lektion geschafft.</b> Probier es auch mal mit gedrehtem Brett.' : `Du brauchst mindestens ${w.need}. Versuch es nochmal!`;
      startBtn.textContent = 'Nochmal';
      if (ok) ctx.solved();
      return;
    }
    let n; do { n = Math.floor(Math.random() * 64); } while (n === cur);
    cur = n; target.textContent = Chess.sqName(cur);
    info.textContent = `Runde ${round} von ${w.rounds} · richtig: ${score}`;
  }
  startBtn.onclick = () => { round = 0; score = 0; running = true; startBtn.textContent = 'Neu starten'; next(); };
  flipBtn.onclick = () => { board.flip = !board.flip; board.render(); };
  host.appendChild(wrap);
};

function collectPar(fen, stars) {
  const s = Chess.parseFEN(fen);
  const pcs = s.b.map((p, i) => [p, i]).filter(([p]) => p);
  if (pcs.length !== 1 || !stars.length) return null;
  const piece = pcs[0][0], idx = stars.map(Chess.sqIdx);
  const full = (1 << idx.length) - 1;
  const seen = new Set(); let q = [[pcs[0][1], 0]]; let d = 0;
  while (q.length && d < 30) {
    const nq = [];
    for (const [sq, mask] of q) {
      if (mask === full) return d;
      const st = { b: Array(64).fill(null), turn: 'w', castle: '', ep: -1, half: 0, full: 1 };
      st.b[sq] = piece;
      for (const m of Chess.legalMoves(st, 'w')) {
        let nm = mask; const k = idx.indexOf(m.to); if (k >= 0) nm |= 1 << k;
        const key = m.to * 64 + nm; if (seen.has(key)) continue; seen.add(key); nq.push([m.to, nm]);
      }
    }
    q = nq; d++;
  }
  return null;
}

Widgets.collect = (host, w, ctx) => {
  const wrap = h('div', 'wbox');
  const bd = h('div');
  const info = h('div', 'status', '');
  const bar = h('div', 'btnrow');
  const reset = h('button', 'btn ghost', '⟲ Neu starten');
  bar.append(reset);
  wrap.append(info, bd, bar);
  const par = collectPar(w.fen, w.stars);
  let moves = 0;
  const board = new Board(bd, {
    interactive: true,
    canSelect: (sq, p) => Chess.colorOf(p) === 'w',
    getMoves: sq => Chess.legalMoves(board.state, 'w').filter(m => m.from === sq),
    onMove: m => {
      moves++;
      board.last = m;
      const n = Chess.makeMove(board.state, m); n.turn = 'w'; n.ep = -1;
      board.stars.delete(m.to);
      board.state = n; board.render(); update();
    },
  });
  const blacks = () => board.state.b.filter(p => p && Chess.colorOf(p) === 'b').length;
  function update() {
    const left = board.stars.size, bl = blacks();
    const parts = [];
    if (w.stars.length) parts.push(`Sterne übrig: <b>${left}</b>`);
    if (bl || !w.stars.length) parts.push(`Schwarze Figuren übrig: <b>${bl}</b>`);
    parts.push(`Züge: <b>${moves}</b>`);
    if (par) parts.push(`Bestmarke: <b>${par}</b>`);
    if (!left && !bl) {
      const perfect = par && moves <= par;
      info.innerHTML = `<b class="good">Geschafft in ${moveCount(moves)}!</b> ` + (par ? (perfect ? 'Perfekt – das ist die Bestmarke! 🏆' : `Die Bestmarke liegt bei ${par}. Schaffst du sie auch?`) : '');
      ctx.solved();
    } else info.innerHTML = parts.join(' · ');
  }
  function start() { moves = 0; board.last = null; board.stars = new Set(w.stars.map(Chess.sqIdx)); board.set(Chess.parseFEN(w.fen)); update(); }
  reset.onclick = start; start();
  host.appendChild(wrap);
};

Widgets.puzzles = (host, w, ctx) => {
  const wrap = h('div', 'wbox');
  const head = h('div', 'pz-head');
  const prompt = h('div', 'status');
  const bd = h('div');
  const fb = h('div', 'feedback');
  const bar = h('div', 'btnrow');
  const hintB = h('button', 'btn ghost', '💡 Tipp');
  const solB = h('button', 'btn ghost', 'Lösung zeigen');
  const retryB = h('button', 'btn ghost', '⟲ Nochmal');
  const nextB = h('button', 'btn', 'Nächste Aufgabe ▶');
  bar.append(hintB, solB, retryB, nextB);
  wrap.append(head, prompt, bd, fb, bar);
  const solvedSet = new Set();
  let idx = 0, item, played, busy, finished, mySide;
  const board = new Board(bd, {
    interactive: true,
    canSelect: (sq, p) => !busy && !finished && Chess.colorOf(p) === board.state.turn,
    getMoves: sq => Chess.legalMoves(board.state).filter(m => m.from === sq),
    onMove: m => userMove(m),
  });
  function renderHead() {
    head.innerHTML = '';
    w.items.forEach((_, i) => {
      const d = h('button', 'pz-dot' + (i === idx ? ' cur' : '') + (solvedSet.has(i) ? ' ok' : ''), String(i + 1));
      d.onclick = () => load(i);
      head.appendChild(d);
    });
  }
  function load(i) {
    idx = i; item = w.items[i]; played = []; busy = false; finished = false;
    const s = Chess.parseFEN(item.fen);
    mySide = s.turn;
    board.flip = mySide === 'b'; board.last = null; board.marks = {}; board.arrows = [];
    board.set(s);
    prompt.innerHTML = `<span class="side ${mySide}"></span><b>${sideLabel(mySide)} am Zug.</b> ${item.prompt}`;
    fb.className = 'feedback'; fb.innerHTML = '';
    nextB.style.display = 'none'; retryB.style.display = 'none'; hintB.style.display = ''; solB.style.display = '';
    renderHead();
  }
  const matching = () => item.lines.filter(l => played.every((u, k) => l[k] === u));
  async function userMove(m) {
    const u = Chess.uci(m);
    const n = Chess.makeMove(board.state, m);
    const isMate = Chess.status(n) === 'matt';
    const cand = matching().filter(l => l[played.length] === u || (l[played.length].length === 4 && l[played.length] === u.slice(0, 4) && !m.promo));
    if (isMate && item.mate) { board.last = m; board.set(n); return win(); }
    if (!cand.length) {
      board.last = m; board.set(n);
      board.flashSq(m.to, 'bad', 700);
      fb.className = 'feedback bad';
      fb.innerHTML = Chess.status(n) === 'patt' ? 'Patt! Das wäre nur remis. Versuch es nochmal.' : 'Das ist nicht der beste Zug. Versuch es nochmal!';
      busy = true;
      await sleep(900);
      const back = Chess.parseFEN(item.fen); let s = back;
      for (const x of played) s = Chess.makeMove(s, Chess.findUci(s, x));
      board.last = null; board.set(s); busy = false;
      return;
    }
    played.push(u); board.last = m; board.set(n);
    const line = cand[0];
    if (played.length >= line.length) return win();
    busy = true; fb.className = 'feedback ok'; fb.innerHTML = 'Richtig! Weiter …';
    await sleep(650);
    const reply = Chess.findUci(board.state, line[played.length]);
    played.push(line[played.length]);
    board.last = reply; board.set(Chess.makeMove(board.state, reply));
    busy = false;
    if (played.length >= line.length) return win();
    fb.innerHTML = 'Richtig! Und jetzt?';
  }
  function win(shown) {
    finished = true;
    if (!shown) solvedSet.add(idx);
    fb.className = 'feedback ' + (shown ? 'info' : 'ok');
    fb.innerHTML = (shown ? '<b>Lösung:</b> ' : '<b>Richtig! 🎉</b> ') + (item.explain || '');
    hintB.style.display = 'none'; solB.style.display = 'none'; retryB.style.display = '';
    nextB.style.display = idx < w.items.length - 1 ? '' : 'none';
    renderHead();
    if (solvedSet.size === w.items.length) {
      ctx.solved();
      if (!shown) fb.innerHTML += '<div class="good small" style="margin-top:.4em">Alle Aufgaben dieser Lektion gelöst!</div>';
    } else if (idx === w.items.length - 1) {
      fb.innerHTML += '<div class="small" style="margin-top:.4em">Es sind noch Aufgaben offen – tippe oben auf die Nummern.</div>';
    }
  }
  hintB.onclick = () => {
    const line = matching()[0]; const u = line[played.length];
    board.marks = { [u.slice(0, 2)]: 'hint' }; board.render();
    fb.className = 'feedback info'; fb.innerHTML = '💡 ' + (item.hint || 'Schau dir die markierte Figur an.');
  };
  solB.onclick = async () => {
    busy = true;
    let s = Chess.parseFEN(item.fen); const line = item.lines[0]; board.marks = {};
    board.last = null; board.set(s);
    for (const u of line) { await sleep(600); const m = Chess.findUci(s, u); s = Chess.makeMove(s, m); board.last = m; board.set(s); }
    busy = false; win(true);
  };
  retryB.onclick = () => load(idx);
  nextB.onclick = () => load(idx + 1);
  load(0);
  host.appendChild(wrap);
};

Widgets.quiz = (host, w, ctx) => {
  const wrap = h('div', 'wbox');
  const head = h('div', 'pz-head');
  const body = h('div');
  wrap.append(head, body);
  const right = new Set();
  let idx = 0;
  function load(i) {
    idx = i; const q = w.items[i];
    head.innerHTML = '';
    w.items.forEach((_, k) => { const d = h('button', 'pz-dot' + (k === i ? ' cur' : '') + (right.has(k) ? ' ok' : ''), String(k + 1)); d.onclick = () => load(k); head.appendChild(d); });
    body.innerHTML = '';
    if (q.fen) {
      const bd = h('div', 'quiz-board'); body.appendChild(bd);
      const s = Chess.parseFEN(q.fen);
      const b = new Board(bd, { flip: false }); b.set(s);
      body.appendChild(h('p', 'muted small center', `${sideLabel(s.turn)} am Zug`));
    }
    body.appendChild(h('p', 'quiz-q', q.q));
    const opts = h('div', 'quiz-opts'); body.appendChild(opts);
    const fb = h('div', 'feedback'); body.appendChild(fb);
    const nextB = h('button', 'btn', 'Nächste Frage ▶'); nextB.style.display = 'none';
    nextB.onclick = () => load(idx + 1);
    body.appendChild(h('div', 'btnrow')).appendChild(nextB);
    q.opts.forEach((o, k) => {
      const b = h('button', 'opt', o);
      b.onclick = () => {
        [...opts.children].forEach(c => c.disabled = true);
        if (k === q.a) { b.classList.add('ok'); right.add(i); fb.className = 'feedback ok'; fb.innerHTML = '<b>Richtig!</b> ' + q.explain; }
        else { b.classList.add('bad'); opts.children[q.a].classList.add('ok'); fb.className = 'feedback bad'; fb.innerHTML = '<b>Nicht ganz.</b> ' + q.explain + ' <button class="linkbtn">Nochmal versuchen</button>'; $('.linkbtn', fb).onclick = () => load(i); }
        if (i < w.items.length - 1) nextB.style.display = '';
        if (right.size === w.items.length) { ctx.solved(); fb.innerHTML += '<div class="good small" style="margin-top:.4em">Alle Fragen richtig beantwortet!</div>'; }
        [...head.children].forEach((d, kk) => d.classList.toggle('ok', right.has(kk)));
      };
      opts.appendChild(b);
    });
  }
  load(0);
  host.appendChild(wrap);
};

Widgets.replay = (host, w, ctx) => {
  const wrap = h('div', 'wbox');
  const bd = h('div');
  const note = h('div', 'feedback info replay-note');
  const bar = h('div', 'btnrow');
  const b0 = h('button', 'btn ghost', '⏮'), bp = h('button', 'btn ghost', '◀ Zurück'), bn = h('button', 'btn', 'Weiter ▶');
  bar.append(b0, bp, bn);
  wrap.append(bd, note, bar);
  const board = new Board(bd, {});
  const states = [Chess.parseFEN(w.fen)], moves = [], sans = [];
  for (const u of w.moves) { const s = states[states.length - 1]; const m = Chess.findUci(s, u); sans.push(Chess.san(s, m)); moves.push(m); states.push(Chess.makeMove(s, m)); }
  let i = 0;
  function show() {
    board.last = i ? moves[i - 1] : null; board.set(states[i]);
    if (!i) note.innerHTML = '<span class="muted">Klicke auf „Weiter ▶“, um den ersten Zug zu sehen.</span>';
    else {
      const s = states[i - 1]; const num = s.full + (s.turn === 'w' ? '.' : '…');
      note.innerHTML = `<b class="mv">${num} ${sans[i - 1]}</b> ${w.notes[i - 1] || ''}`;
    }
    bp.disabled = !i; b0.disabled = !i; bn.disabled = i >= moves.length;
  }
  b0.onclick = () => { i = 0; show(); };
  bp.onclick = () => { if (i) { i--; show(); } };
  bn.onclick = () => { if (i < moves.length) { i++; show(); } };
  show();
  host.appendChild(wrap);
};

Widgets.endgame = (host, w, ctx) => {
  const wrap = h('div', 'wbox');
  const info = h('div', 'status');
  const bd = h('div');
  const fb = h('div', 'feedback');
  const bar = h('div', 'btnrow');
  const undoB = h('button', 'btn ghost', '↶ Zug zurück');
  const resetB = h('button', 'btn ghost', '⟲ Neu starten');
  bar.append(undoB, resetB);
  wrap.append(info, bd, fb, bar);
  let hist, busy, over;
  const board = new Board(bd, {
    interactive: true,
    canSelect: (sq, p) => !busy && !over && Chess.colorOf(p) === 'w' && board.state.turn === 'w',
    getMoves: sq => Chess.legalMoves(board.state).filter(m => m.from === sq),
    onMove: async m => {
      hist.push({ s: board.state, last: board.last });
      board.last = m; board.set(Chess.makeMove(board.state, m));
      if (check()) return;
      busy = true; upd(); await sleep(250);
      const r = Chess.search(board.state, 3, 700);
      board.last = r.move; board.set(Chess.makeMove(board.state, r.move));
      busy = false; check(); upd();
    },
  });
  const myMoves = () => hist.length;
  const whiteMat = s => s.b.filter(p => p && p !== 'K' && Chess.colorOf(p) === 'w').length;
  const startMat = whiteMat(Chess.parseFEN(w.fen));
  function check() {
    const st = Chess.status(board.state);
    if (st === 'matt') { over = true; fb.className = 'feedback ok'; fb.innerHTML = `<b>Schachmatt in ${moveCount(myMoves())}! 🎉</b> Sehr gut. Versuch es ruhig noch ein paar Mal – das muss sitzen.`; ctx.solved(); upd(); return true; }
    if (st === 'patt') { over = true; fb.className = 'feedback bad'; fb.innerHTML = '<b>Patt!</b> Der schwarze König hat keinen Zug, steht aber nicht im Schach – nur remis. Nimm den Zug zurück und gib ihm ein Feld mehr.'; upd(); return true; }
    if (whiteMat(board.state) < startMat) { over = true; fb.className = 'feedback bad'; fb.innerHTML = '<b>Oh nein – deine Figur wurde geschlagen.</b> Jetzt kann niemand mehr mattsetzen. Nimm den Zug zurück!'; upd(); return true; }
    if (myMoves() >= w.maxMoves) { over = true; fb.className = 'feedback bad'; fb.innerHTML = `Du hast ${w.maxMoves} Züge gebraucht, ohne mattzusetzen. Versuch es nochmal mit der Methode aus der Erklärung.`; upd(); return true; }
    fb.className = 'feedback'; fb.innerHTML = '';
    return false;
  }
  function upd() {
    info.innerHTML = `<span class="side w"></span><b>Du spielst Weiß.</b> Züge: <b>${myMoves()}</b> / ${w.maxMoves}` + (busy ? ' · <span class="muted">Schwarz denkt …</span>' : '');
  }
  function start() { hist = []; busy = false; over = false; board.last = null; board.set(Chess.parseFEN(w.fen)); fb.className = 'feedback'; fb.innerHTML = ''; upd(); }
  undoB.onclick = () => { if (busy || !hist.length) return; const x = hist.pop(); board.last = x.last; board.set(x.s); over = false; check(); upd(); };
  resetB.onclick = start;
  start();
  host.appendChild(wrap);
};

// ---------- Navigation & Lektionen ----------
const FLAT = [];
CURRICULUM.forEach((c, ci) => c.lessons.forEach(l => FLAT.push(Object.assign(l, { chIdx: ci, chTitle: c.ch }))));
const EXERCISES = ['coords', 'collect', 'puzzles', 'quiz', 'endgame'];
const needs = l => l.steps.map((s, i) => [s, i]).filter(([s]) => s.w && EXERCISES.includes(s.w.type)).map(([, i]) => i);
function lessonDone(l) { return !!progress['done:' + l.id]; }
function updateLessonDone(l) {
  const req = needs(l);
  const ok = req.every(i => progress[`${l.id}:${i}`]) && (req.length || progress[`seen:${l.id}`]);
  if (ok && !progress['done:' + l.id]) { progress['done:' + l.id] = true; saveProgress(); renderNav(); toast(`✓ Lektion „${l.title}“ abgeschlossen`); }
}

let curLesson = null, curStep = 0;

let curMode = 'op', curRoute = '';
function renderNav() {
  $$('.tabs a').forEach(t => t.classList.toggle('on', t.dataset.mode === curMode && (curMode !== 'op' || (t.dataset.r === 'explorer') === (curRoute === 'explorer'))));
  if (curMode === 'kurs') renderKursNav(); else renderOpNav();
}
function renderKursNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  nav.appendChild(h('p', 'muted small nav-hint', 'Der Grundkurs ist optional – für Regeln, Taktik und Mattführungen.'));
  CURRICULUM.forEach((c, ci) => {
    const sec = h('div', 'nav-ch');
    const done = c.lessons.filter(lessonDone).length;
    sec.appendChild(h('div', 'nav-ch-title', `<span>${ci + 1}. ${c.ch}</span><span class="nav-count">${done}/${c.lessons.length}</span>`));
    c.lessons.forEach(l => {
      const a = h('a', 'nav-l' + (curLesson === l ? ' cur' : '') + (lessonDone(l) ? ' done' : ''), `<span class="chk">${lessonDone(l) ? '✓' : ''}</span><span>${l.title}</span>`);
      a.href = '#' + l.id;
      sec.appendChild(a);
    });
    nav.appendChild(sec);
  });
  const total = FLAT.length, d = FLAT.filter(lessonDone).length;
  $('#prog-fill').style.width = (100 * d / total) + '%';
  $('#prog-text').textContent = `${d} von ${total} Lektionen`;
}

function openLesson(l, step = 0) {
  if (playCleanup) { playCleanup(); playCleanup = null; }
  curLesson = l; curStep = step; curMode = 'kurs'; curRoute = l.id;
  document.body.classList.remove('nav-open');
  const main = $('#main'); main.innerHTML = '';
  const st = l.steps[step];
  const head = h('div', 'lhead');
  head.appendChild(h('div', 'crumb', `Kapitel ${l.chIdx + 1} · ${l.chTitle}`));
  head.appendChild(h('h1', '', l.title));
  if (l.steps.length > 1) {
    const dots = h('div', 'steps');
    l.steps.forEach((s, i) => {
      const ex = s.w && EXERCISES.includes(s.w.type);
      const d = h('button', 'step' + (i === step ? ' cur' : '') + (ex && progress[`${l.id}:${i}`] ? ' ok' : ''), String(i + 1));
      d.title = ex ? 'Übung' : 'Erklärung';
      d.onclick = () => openLesson(l, i);
      dots.appendChild(d);
    });
    head.appendChild(dots);
  }
  main.appendChild(head);
  const body = h('div', 'lbody' + (st.w ? ' has-w' : ''));
  const text = h('div', 'ltext prose', st.html);
  body.appendChild(text);
  if (st.w) {
    const wh = h('div', 'lwidget');
    body.appendChild(wh);
    const ctx = {
      solved: () => { if (!progress[`${l.id}:${step}`]) { progress[`${l.id}:${step}`] = true; saveProgress(); const dot = $$('.step')[step]; dot && dot.classList.add('ok'); } updateLessonDone(l); },
    };
    Widgets[st.w.type](wh, st.w, ctx);
  }
  main.appendChild(body);
  // Fußnavigation
  const fi = FLAT.indexOf(l);
  const foot = h('div', 'lfoot');
  const prev = h('button', 'btn ghost', '◀ Zurück');
  const next = h('button', 'btn primary', '');
  if (step > 0) prev.onclick = () => openLesson(l, step - 1);
  else if (fi > 0) prev.onclick = () => go(FLAT[fi - 1].id, FLAT[fi - 1].steps.length - 1);
  else prev.disabled = true;
  if (step < l.steps.length - 1) { next.textContent = 'Weiter ▶'; next.onclick = () => openLesson(l, step + 1); }
  else if (fi < FLAT.length - 1) { next.textContent = 'Nächste Lektion: ' + FLAT[fi + 1].title + ' ▶'; next.onclick = () => go(FLAT[fi + 1].id); }
  else { next.textContent = 'Jetzt spielen ♞'; next.onclick = () => go('spielen'); }
  foot.append(prev, next);
  main.appendChild(foot);
  if (step === l.steps.length - 1) { progress[`seen:${l.id}`] = true; saveProgress(); updateLessonDone(l); }
  renderNav();
  window.scrollTo(0, 0); main.scrollTop = 0;
}
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function go(id, step = 0) {
  pendingStep = step;
  if (location.hash === '#' + id) route(); else location.hash = id;
}
let pendingStep = 0;
function route() {
  const id = location.hash.slice(1);
  const step = pendingStep; pendingStep = 0;
  if (playCleanup && id !== 'spielen') { playCleanup(); playCleanup = null; }
  document.body.classList.remove('nav-open');
  if (id === 'spielen') return openPlay();
  const l = FLAT.find(x => x.id === id);
  if (l) return openLesson(l, step);
  if (id === 'grundkurs') return openLesson(FLAT.find(x => !lessonDone(x)) || FLAT[0]);
  curMode = 'op'; curRoute = id; curLesson = null;
  if (id === 'explorer') openExplorer();
  else if (id.startsWith('op-') && OP_BY_ID[id.slice(3)]) openOpening(id.slice(3));
  else { curRoute = 'eroeffnungen'; openOverview(); }
  renderNav();
}

function toast(msg) {
  const t = h('div', 'toast', msg); document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2600);
}

// ---------- Spielen gegen den Computer ----------
let playCleanup = null;
const LEVELS = [
  { name: 'Anfänger', depth: 1, time: 300, noise: 220 },
  { name: 'Leicht', depth: 2, time: 500, noise: 60 },
  { name: 'Mittel', depth: 3, time: 1000, noise: 15 },
  { name: 'Stark', depth: 5, time: 2500, noise: 0 },
];
function openPlay() {
  curLesson = 'play'; curMode = 'op'; curRoute = 'spielen';
  document.body.classList.remove('nav-open');
  const main = $('#main'); main.innerHTML = '';
  const head = h('div', 'lhead');
  head.appendChild(h('div', 'crumb', 'Üben'));
  head.appendChild(h('h1', '', 'Gegen den Computer spielen'));
  main.appendChild(head);
  let level = 1, myColor = 'w';
  try { const p = JSON.parse(localStorage.getItem(STORE_KEY + '-play') || '{}'); if (p.level != null) level = p.level; if (p.color) myColor = p.color; } catch (e) {}
  const body = h('div', 'lbody has-w play');
  const side = h('div', 'ltext');
  const settings = h('div', 'card');
  settings.innerHTML = `<div class="field"><label>Stärke</label><div class="seg" id="lv"></div></div>
    <div class="field"><label>Deine Farbe</label><div class="seg" id="col"></div></div>
    <div class="field"><label>Startstellung</label><select id="startpos" class="sel"></select></div>
    <button class="btn primary" id="newg">Neue Partie</button>`;
  side.appendChild(settings);
  const tips = h('div', 'card prose small');
  tips.innerHTML = `<b>Denk an die Checkliste:</b><ol><li>Was droht mein Gegner?</li><li>Schachs, Schlagzüge, Drohungen</li><li>Ist meine Figur nach dem Zug sicher?</li></ol><p class="muted">Mit „Tipp“ zeigt dir der Computer einen guten Zug (als Pfeil). Nutze ihn erst, wenn du selbst nachgedacht hast!</p>`;
  const moveList = h('div', 'card movelist');
  side.append(moveList, tips);
  const wh = h('div', 'lwidget');
  const status = h('div', 'status');
  const capTop = h('div', 'caps'), capBot = h('div', 'caps');
  const bd = h('div');
  const bar = h('div', 'btnrow');
  const undoB = h('button', 'btn ghost', '↶ Zurück'), hintB = h('button', 'btn ghost', '💡 Tipp'), flipB = h('button', 'btn ghost', '⇅ Drehen');
  bar.append(undoB, hintB, flipB);
  wh.append(status, capTop, bd, capBot, bar);
  body.append(wh, side);
  main.appendChild(body);

  let hist = [], sans = [], state, over = false, thinking = false, alive = true, reps = {};
  playCleanup = () => { alive = false; };
  const board = new Board(bd, {
    interactive: true,
    canSelect: (sq, p) => alive && !over && !thinking && state.turn === myColor && Chess.colorOf(p) === myColor,
    getMoves: sq => Chess.legalMoves(state).filter(m => m.from === sq),
    onMove: m => { play(m); if (!over) setTimeout(cpu, 120); },
  });
  function play(m) {
    hist.push({ state, last: board.last, sans: sans.slice(), reps: Object.assign({}, reps) });
    sans.push(Chess.san(state, m));
    state = Chess.makeMove(state, m);
    const k = Chess.posKey(state); reps[k] = (reps[k] || 0) + 1;
    board.arrows = []; board.last = m; board.set(state);
    upd();
  }
  async function cpu() {
    if (over || state.turn === myColor || !alive) return;
    thinking = true; upd();
    await sleep(60);
    const L = LEVELS[level];
    const r = Chess.search(state, L.depth, L.time, L.noise);
    if (!alive) return;
    thinking = false;
    if (r && r.move) play(r.move);
  }
  function upd() {
    const st = Chess.status(state);
    const rep = reps[Chess.posKey(state)] >= 3;
    over = st === 'matt' || st === 'patt' || st === 'material' || st === '50zug' || rep;
    let msg;
    if (st === 'matt') msg = state.turn === myColor ? '<b class="bad">Schachmatt – du hast verloren.</b> Schau dir die Partie an: Wo hättest du die Gefahr sehen können?' : '<b class="good">Schachmatt – du hast gewonnen! 🎉</b>';
    else if (st === 'patt') msg = '<b>Patt – remis.</b>';
    else if (st === 'material') msg = '<b>Remis</b> – kein Spieler kann mehr mattsetzen.';
    else if (st === '50zug') msg = '<b>Remis</b> nach der 50-Züge-Regel.';
    else if (rep) msg = '<b>Remis</b> durch dreifache Stellungswiederholung.';
    else if (thinking) msg = `<span class="side ${state.turn}"></span>Der Computer denkt …`;
    else msg = `<span class="side ${state.turn}"></span>${state.turn === myColor ? '<b>Du bist am Zug.</b>' : 'Computer am Zug.'}` + (st === 'schach' ? ' <b class="bad">Schach!</b>' : '');
    status.innerHTML = msg;
    // Zugliste
    let html = '<div class="ml-title">Partie</div><div class="ml">';
    const startTurn = hist.length ? hist[0].state : state;
    let num = startTurn.full, white = startTurn.turn === 'w';
    if (!white) html += `<span class="n">${num}.</span><span>…</span>`;
    sans.forEach(s => { if (white) html += `<span class="n">${num}.</span>`; html += `<span>${s}</span>`; if (!white) num++; white = !white; });
    html += '</div>';
    moveList.innerHTML = sans.length ? html : '<div class="ml-title">Partie</div><p class="muted small">Noch keine Züge.</p>';
    const ml = $('.ml', moveList); if (ml) ml.scrollTop = ml.scrollHeight;
    // geschlagene Figuren
    const count = c => { const o = { q: 1, r: 2, b: 2, n: 2, p: 8 }; for (const p of state.b) if (p && Chess.colorOf(p) === c && p.toLowerCase() !== 'k') o[p.toLowerCase()]--; return o; };
    const mat = c => state.b.reduce((a, p) => a + (p && Chess.colorOf(p) === c ? Chess.VAL[p.toLowerCase()] : 0), 0);
    const capStr = (lostColor) => { const o = count(lostColor); let s = ''; for (const t of 'qrbnp') for (let i = 0; i < Math.max(0, o[t]); i++) s += `<span class="pc ${lostColor === 'w' ? 'pw' : 'pb'}">${GLYPH[t]}︎</span>`; return s; };
    const opp = Chess.other(myColor);
    const diff = Math.round((mat(myColor) - mat(opp)) / 100);
    capTop.innerHTML = capStr(myColor) + (diff < 0 ? ` <span class="adv">+${-diff}</span>` : '');
    capBot.innerHTML = capStr(opp) + (diff > 0 ? ` <span class="adv">+${diff}</span>` : '');
    undoB.disabled = !hist.length || thinking || hist[hist.length - 1].book; hintB.disabled = over || thinking || state.turn !== myColor;
  }
  function newGame() {
    try { localStorage.setItem(STORE_KEY + '-play', JSON.stringify({ level, color: myColor })); } catch (e) {}
    state = Chess.parseFEN(START_FEN); hist = []; sans = []; over = false; thinking = false; reps = { [Chess.posKey(state)]: 1 };
    board.last = null;
    const sp = $('#startpos', settings).value;
    if (sp) {
      const [oid, key] = sp.split('|');
      const moves = oid === '_custom' ? playFrom.moves : OP_BY_ID[oid].lines.find(l => l.key === key).moves.map(x => Chess.uci(x.m));
      for (const u of moves) { const m = Chess.findUci(state, u); hist.push({ state, last: board.last, sans: sans.slice(), reps: Object.assign({}, reps), book: true }); sans.push(Chess.san(state, m)); state = Chess.makeMove(state, m); board.last = m; }
    }
    board.flip = myColor === 'b'; board.arrows = []; board.set(state); upd();
    if (sp) status.innerHTML += ' <span class="muted small">(Start nach der Eröffnungsphase)</span>';
    if (state.turn !== myColor) setTimeout(cpu, 300);
  }
  function seg(el, items, get, set) {
    el.innerHTML = '';
    items.forEach((t, i) => { const b = h('button', i === get() ? 'on' : '', t); b.onclick = () => { set(i); seg(el, items, get, set); }; el.appendChild(b); });
  }
  seg($('#lv', settings), LEVELS.map(l => l.name), () => level, i => { level = i; });
  seg($('#col', settings), ['Weiß', 'Schwarz'], () => (myColor === 'w' ? 0 : 1), i => { myColor = i ? 'b' : 'w'; });
  const spSel = $('#startpos', settings);
  let opts = '<option value="">Normale Grundstellung</option>';
  if (playFrom) opts += `<option value="_custom|x" selected>${playFrom.name}</option>`;
  for (const g of OPENING_GROUPS) {
    opts += `<optgroup label="${g.title}">`;
    for (const o of OPS.filter(o => o.group === g.id)) opts += `<option value="${o.id}|main">${o.name}</option>`;
    opts += '</optgroup>';
  }
  spSel.innerHTML = opts;
  $('#newg', settings).onclick = newGame;
  undoB.onclick = () => {
    if (thinking || !hist.length || hist[hist.length - 1].book) return;
    let x = hist.pop();
    if (x.state.turn !== myColor && hist.length && !hist[hist.length - 1].book) x = hist.pop();
    state = x.state; sans = x.sans; reps = x.reps; board.last = x.last; board.arrows = []; over = false; board.set(state); upd();
    if (state.turn !== myColor) setTimeout(cpu, 200);
  };
  hintB.onclick = async () => {
    hintB.disabled = true; status.innerHTML = 'Ich suche einen guten Zug …'; await sleep(30);
    const r = Chess.search(state, 4, 1500);
    if (r && r.move) { board.arrows = [Chess.uci(r.move).slice(0, 4)]; board.render(); }
    upd(); status.innerHTML += ` <span class="muted">Tipp: ${Chess.san(state, r.move)}</span>`;
  };
  flipB.onclick = () => { board.flip = !board.flip; board.render(); };
  newGame();
  renderNav();
}

// ---------- Start ----------
$('#menu').onclick = () => document.body.classList.toggle('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');
$('#reset').onclick = () => {
  const box = $('#confirm'); box.classList.remove('hidden');
};
$('#confirm-no').onclick = () => $('#confirm').classList.add('hidden');
$('#confirm-yes').onclick = () => { progress = {}; saveProgress(); $('#confirm').classList.add('hidden'); renderNav(); route(); };
window.addEventListener('hashchange', route);
renderNav();
route();

</script>
